name: Export verified production image

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Build production image run ID (for example 35926974079)'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify successful build and its immutable digest artifact
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > source-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > digest-artifacts.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          def verify_run(run, artifacts, repository, run_id):
              if (str(run.get("id")) != run_id
                      or run.get("path") != ".github/workflows/build-production.yml"
                      or run.get("status") != "completed" or run.get("conclusion") != "success"
                      or run.get("repository", {}).get("full_name") != repository
                      or run.get("head_repository", {}).get("full_name") != repository
                      or run.get("repository", {}).get("private") is not True):
                  raise ValueError("Requires a successful production build from this private repository")
              source_sha = str(run.get("head_sha") or "")
              if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
                  raise ValueError("Invalid source SHA")
              if len(artifacts) != 1:
                  raise ValueError("Requires exactly one production-image-digest artifact")
              artifact = artifacts[0]
              origin = artifact.get("workflow_run") or {}
              if (artifact.get("name") != "production-image-digest" or artifact.get("expired") is not False
                      or str(origin.get("id")) != run_id or origin.get("head_sha") != source_sha
                      or not isinstance(artifact.get("id"), int) or artifact["id"] <= 0):
                  raise ValueError("Digest artifact is expired or belongs to another build")
              return source_sha, artifact["id"]

          run = json.loads(Path("source-run.json").read_text())
          artifacts = [artifact for page in json.loads(Path("digest-artifacts.json").read_text())
                       for artifact in page["artifacts"] if artifact.get("name") == "production-image-digest"]
          source_sha, artifact_id = verify_run(run, artifacts, os.environ["GITHUB_REPOSITORY"], os.environ["BUILD_RUN_ID"])
          Path("verified-source.json").write_text(json.dumps({"source_sha": source_sha, "build_run_id": os.environ["BUILD_RUN_ID"],
              "workflow": run["path"], "digest_artifact_id": artifact_id}, indent=2) + "\n")
          PY
          DIGEST_ARTIFACT_ID="$(jq -r '.digest_artifact_id' verified-source.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DIGEST_ARTIFACT_ID/zip" > digest-artifact.zip
          python3 - <<'PY'
          import json, os, re, zipfile
          from pathlib import Path

          def verify_digest(contents, repository):
              image = contents.decode("utf-8").strip()
              if not re.fullmatch(r"ghcr\.io/" + re.escape(repository.lower()) + r"/frappe@sha256:[0-9a-f]{64}", image):
                  raise ValueError("Only this repository's exact GHCR image digest is accepted")
              return image

          with zipfile.ZipFile("digest-artifact.zip") as archive:
              files = archive.infolist()
              if len(files) != 1 or files[0].filename != "image-digest.txt" or files[0].file_size > 1024:
                  raise ValueError("Unexpected digest artifact contents")
              image = verify_digest(archive.read(files[0]), os.environ["GITHUB_REPOSITORY"])
          source = json.loads(Path("verified-source.json").read_text())
          source["image_ref"] = image
          Path("verified-source.json").write_text(json.dumps(source, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image_ref={image}\nsource_sha={source['source_sha']}\n")
          PY
      - name: Pull and export the same verified linux amd64 image without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.source.outputs.image_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" > candidate-image.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          def verify_image(info, image, source_sha):
              labels = info.get("Config", {}).get("Labels") or {}
              if (info.get("Architecture") != "amd64" or info.get("Os") != "linux"
                      or labels.get("org.opencontainers.image.revision") != source_sha
                      or image not in (info.get("RepoDigests") or [])
                      or not re.fullmatch(r"sha256:[0-9a-f]{64}", str(info.get("Id") or ""))):
                  raise ValueError("Pulled image architecture, digest, or OCI revision differs from the successful build")
              return info["Id"]

          infos = json.loads(Path("candidate-image.json").read_text())
          if len(infos) != 1:
              raise ValueError("Expected exactly one image")
          image_id = verify_image(infos[0], os.environ["IMAGE"], os.environ["SOURCE_SHA"])
          source = json.loads(Path("verified-source.json").read_text())
          source.update(image_id=image_id, revision=os.environ["SOURCE_SHA"], architecture="amd64", os="linux",
              image_tag=f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}/frappe:{os.environ['SOURCE_SHA']}")
          Path("export").mkdir()
          Path("export/provenance.json").write_text(json.dumps(source, indent=2) + "\n")
          PY
          # save/load does not reliably retain RepoDigests. Preserve a source-SHA
          # tag and image ID for readback; deployment must still use the digest.
          VERIFIED_IMAGE_ID="$(jq -r '.image_id' export/provenance.json)"
          EXPORT_IMAGE_TAG="$(jq -r '.image_tag' export/provenance.json)"
          docker tag "$IMAGE" "$EXPORT_IMAGE_TAG"
          [[ "$(docker image inspect "$EXPORT_IMAGE_TAG" --format '{{.Id}}')" == "$VERIFIED_IMAGE_ID" ]]
          docker save "$EXPORT_IMAGE_TAG" | gzip -1 > export/image.tar.gz
          (cd export && sha256sum image.tar.gz > image.tar.gz.sha256)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("export/provenance.json")
          source = json.loads(path.read_text())
          source["archive_sha256"] = Path("export/image.tar.gz.sha256").read_text().split()[0]
          source["archive_bytes"] = Path("export/image.tar.gz").stat().st_size
          path.write_text(json.dumps(source, indent=2) + "\n")
          lines = ["Exported, not deployed.", f"Image: `{source['image_ref']}`", f"Source: `{source['source_sha']}`",
              f"Image ID: `{source['image_id']}`", f"Archive SHA-256: `{source['archive_sha256']}`",
              "After transfer: verify archive checksum, load, verify tag/image ID, then use the existing exact-digest staging workflow to restore registry metadata. Never deploy by this tag."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-image-export-${{ inputs.build_run_id }}
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
