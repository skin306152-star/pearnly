name: Build production image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/assistant/package-lock.json
      - name: Enforce architecture boundaries
        run: |
          python3 scripts/check-architecture.py
          python3 scripts/test-dms-call-contracts.py
          python3 scripts/test-dms-customer-identity.py
          python3 scripts/test-dms-snapshot-reader.py
      - name: Verify Desk retry actions
        run: |
          node scripts/production/test-issue-actions.cjs
          node tests/test-line-stocktake.cjs
      - name: Verify native POS entry and lifecycle
        run: node --test tests/test_pos_lifecycle.js
      - name: Build the shared frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build the assistant frontend (ADR-019)
        working-directory: frontend/assistant
        run: npm ci && npm run build
      - name: Verify offline DMS editor snapshot rendering
        run: node --test scripts/test-dms-editor-snapshot.cjs
      - name: Build an amd64 image from the exact source revision
        # Layer cache: reuse the dependency layers of the last *verified* image (tagged
        # build-cache by the publish step, after every check passed). Only safe while every
        # Dockerfile step is deterministic: pin versions/digests, never fetch "latest".
        # Credentials are removed right after the build so later test steps never hold them.
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
          CACHE: ghcr.io/${{ github.repository }}/frappe:build-cache
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 \
            --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$CACHE" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -f infrastructure/images/frappe.Dockerfile -t "$IMAGE" .
          docker logout ghcr.io
      - name: Verify the candidate in parallel (offline checks, DMS flow lab, DMS snapshot lab)
        # Independent lanes, no shared host ports/volumes/networks; the stage now lasts as long as the
        # slowest lane. Publishing below still happens only after every lane passed.
        env:
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: bash scripts/ci-candidate-checks.sh parallel
      - name: Remove only the disposable DMS flow laboratory
        if: always()
        env:
          PEARNLY_FLOW_LAB_IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml down --volumes
      - name: Remove only the disposable DMS snapshot laboratory
        if: always()
        env:
          PEARNLY_SNAPSHOT_LAB_IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: docker compose -p pearnly-dms-snapshot-lab -f infrastructure/compose/dms-snapshot-lab.yml down --volumes
      - name: Verify runtime and frontend assets
        env:
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: |
          docker run --rm --entrypoint /home/frappe/frappe-bench/env/bin/python "$IMAGE" -c '
          import platform
          from pathlib import Path
          import frappe, erpnext, pearnly_core, pearnly_dms, pearnly_cowork, pearnly_erp_portal
          assert platform.machine() == "x86_64", platform.machine()
          assert frappe.__version__ == "16.33.0", frappe.__version__
          assert erpnext.__version__ == "16.34.1", erpnext.__version__
          root = Path("/home/frappe/frappe-bench/apps/pearnly_core/pearnly_core/public/pearnly-app")
          assert (root / "index.html").is_file()
          assert list((root / "assets").glob("*.js"))
          assistant = Path("/home/frappe/frappe-bench/apps/pearnly_core/pearnly_core/public/assistant")
          assert (assistant / "index.html").is_file() and (assistant / "manifest.webmanifest").is_file()
          assert list((assistant / "assets").glob("*.js"))
          import anthropic
          assert anthropic.__version__ == "1.8.0", anthropic.__version__
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
              page = browser.new_page()
              page.set_content("<title>Pearnly runtime check</title>")
              assert page.title() == "Pearnly runtime check"
              browser.close()
          print("Runtime, architecture, frontend assets and Chromium passed")'
      - name: Publish private image and record digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
          CACHE: ghcr.io/${{ github.repository }}/frappe:build-cache
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > image-digest.txt
          # Same layers under a second tag: the next build's cache source. Pushed only here,
          # after every verification step passed, so an unverified build never seeds it.
          docker tag "$IMAGE" "$CACHE" && docker push "$CACHE"
          printf 'Source: `%s`\n\nImage: `%s`\n' "$GITHUB_SHA" "$(cat image-digest.txt)" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: production-image-digest
          path: image-digest.txt
          retention-days: 7
