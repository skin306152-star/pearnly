name: Build production image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Enforce architecture boundaries
        run: |
          python3 scripts/check-architecture.py
          python3 scripts/test-dms-call-contracts.py
          python3 scripts/test-dms-customer-identity.py
      - name: Verify Desk retry actions
        run: |
          node scripts/production/test-issue-actions.cjs
          node tests/test-line-stocktake.cjs
      - name: Verify native POS entry and lifecycle
        run: node --test tests/test_pos_lifecycle.js
      - name: Build the shared frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build an amd64 image from the exact source revision
        env:
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -f infrastructure/images/frappe.Dockerfile -t "$IMAGE" .
      - name: Verify account policy and legacy entry points in the candidate runtime
        env:
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint /home/frappe/frappe-bench/env/bin/python \
            -v "$PWD:/candidate:ro" "$IMAGE" /candidate/tests/test_cloud_onboarding.py
          docker run --rm --network none --entrypoint /home/frappe/frappe-bench/env/bin/python \
            -v "$PWD:/candidate:ro" \
            -e PYTHONPATH=/candidate/apps/pearnly_dms:/candidate/apps/pearnly_core:/candidate/apps/pearnly_control \
            "$IMAGE" /candidate/tests/test_dms_entrypoints.py
          docker run --rm --network none --entrypoint /home/frappe/frappe-bench/env/bin/python \
            "$IMAGE" -m unittest pearnly_erp_portal.integrations.test_line_intake pearnly_erp_portal.team.test_identity pearnly_control.account.test_member_service
          docker run --rm --network none --entrypoint /home/frappe/frappe-bench/env/bin/python \
            -v "$PWD:/candidate:ro" "$IMAGE" /candidate/scripts/test-dms-line-runtime.py
          docker run --rm --network none --entrypoint /home/frappe/frappe-bench/env/bin/python \
            -v "$PWD:/candidate:ro" "$IMAGE" /candidate/scripts/test-dms-intake-queue.py
          docker run --rm --network none --entrypoint /home/frappe/frappe-bench/env/bin/python \
            -v "$PWD:/candidate:ro" "$IMAGE" /candidate/scripts/test-dms-query-output.py
          docker run --rm --network none --entrypoint /home/frappe/frappe-bench/env/bin/python \
            -v "$PWD:/candidate:ro" "$IMAGE" /candidate/tests/test_teardown_members.py
      - name: Verify signed DMS webhook and native queued booking in an isolated Site
        env:
          PEARNLY_FLOW_LAB_IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: |
          docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml up -d --wait db redis bench
          docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml exec -T bench env/bin/python /workspace/scripts/dms-flow-lab-init.py
          docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml exec -T bench env/bin/python /workspace/scripts/test-line-usage-redis.py
          docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml exec -T bench env/bin/python /workspace/scripts/test-dms-native-flow.py
          docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml exec -T bench env/bin/python /workspace/scripts/test-dms-native-recovery.py
          docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml exec -T -w /home/frappe/frappe-bench/sites bench /home/frappe/frappe-bench/env/bin/python -c 'import frappe,runpy; frappe.init(site="dms-flow-lab.localhost"); frappe.connect(); frappe.set_user("Administrator"); runpy.run_path("/workspace/scripts/sample-verify-dms-booking-flow.py")["main"]()'
      - name: Remove only the disposable DMS flow laboratory
        if: always()
        env:
          PEARNLY_FLOW_LAB_IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: docker compose -p pearnly-dms-flow-lab -f infrastructure/compose/dms-flow-lab.yml down --volumes
      - name: Verify runtime and frontend assets
        env:
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: |
          docker run --rm --entrypoint /home/frappe/frappe-bench/env/bin/python "$IMAGE" -c '
          import platform
          from pathlib import Path
          import frappe, erpnext, pearnly_core, pearnly_dms, pearnly_cowork, pearnly_erp_portal
          assert platform.machine() == "x86_64", platform.machine()
          assert frappe.__version__ == "16.33.0", frappe.__version__
          assert erpnext.__version__ == "16.34.1", erpnext.__version__
          root = Path("/home/frappe/frappe-bench/apps/pearnly_core/pearnly_core/public/pearnly-app")
          assert (root / "index.html").is_file()
          assert list((root / "assets").glob("*.js"))
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
              page = browser.new_page()
              page.set_content("<title>Pearnly runtime check</title>")
              assert page.title() == "Pearnly runtime check"
              browser.close()
          print("Runtime, architecture, frontend assets and Chromium passed")'
      - name: Publish private image and record digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}/frappe:${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > image-digest.txt
          printf 'Source: `%s`\n\nImage: `%s`\n' "$GITHUB_SHA" "$(cat image-digest.txt)" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: production-image-digest
          path: image-digest.txt
          retention-days: 7
