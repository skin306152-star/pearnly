name: Development checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  architecture-and-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # 界面文案闸门要读基线（merge-base origin/main）那一版的文案
          fetch-depth: 0
      - name: Test the architecture guard
        run: python3 tests/test_architecture_guard.py
      - name: Verify native Desk contracts
        run: python3 tests/test_native_desk_contract.py
      - name: Keep each ERP boot item independent of the others
        run: python3 tests/test_erp_boot_items.py
      - name: Verify ERP purchase lines remember their category by supplier and item
        run: python3 tests/test_erp_category_memory.py
      - name: Render the control-plane LINE setup guide with its screenshots
        run: python3 tests/test_control_line_guide.py
      - name: Verify each product declares its own feature catalog
        run: python3 tests/test_product_feature_catalog.py
      - name: Verify LIFF IDs are stored as IDs, not URLs
        run: python3 tests/test_liff_ids.py
      - name: Verify provisioning creates or corrects each tenant's LIFF on the shared LINE Login channel
        run: python3 tests/test_line_liff.py
      - name: Verify queued/reflected dotted targets resolve
        run: python3 tests/test_queue_targets.py
      - name: Verify Claude recognition route rules and escalation (ADR-022)
        run: python3 tests/test_claude_ocr_rules.py
      - name: Verify DMS queue and reply-token call contracts
        run: python3 scripts/test-dms-call-contracts.py
      - name: Verify exact DMS customer identity before automatic writes
        run: python3 scripts/test-dms-customer-identity.py
      - name: Enforce architecture boundaries
        run: python3 scripts/check-architecture.py
      - name: Verify MR.ERP master defaults are read from the company, never hard-coded
        run: python3 tests/test_cowork_mrerp_masters.py
      - name: Exercise audited offline DMS contracts
        run: python3 scripts/check-dms-offline.py
      - name: Verify forced SSH provisioning entry and contracts
        run: python3 scripts/production/test-provision-agent.py
      - name: Verify provisioning points the LINE webhook at the tenant
        run: python3 scripts/production/test-site-step-webhook.py
      - name: Verify provisioning writes the shared OCR budget and Document AI regions
        run: python3 scripts/production/test-site-step-capacity.py
      - name: Verify tenant teardown deletes only its own originals in Cloud Storage
        run: python3 scripts/production/test-site-step-purge.py
      - name: Verify production memory admission budgets
        run: python3 scripts/check-production-capacity.py
      - name: Verify drained product activation and failure boundary
        run: python3 scripts/production/test-activate-product.py
      - name: Verify DMS bench runtime configuration
        run: python3 scripts/production/test-dms-runtime.py
      - name: Verify the daily offsite backup and restore drill contracts
        run: python3 scripts/production/test-offsite-backup.py
      - name: Verify the Windows helper and the server agree on endpoints, pairing code and downloads
        run: python3 tests/test_companion_contract.py
      - name: Verify any account set on the computer gets its chart read on demand and choices wait for it
        run: python3 tests/test_cowork_any_set_catalog.py
      - name: Verify read-only connection views take no row locks and write paths still lock
        run: python3 tests/test_cowork_connection_read_locks.py
      - name: Verify the companion machine envelope and its method tables (push, folder, on-demand requests)
        run: PYTHONPATH=apps/pearnly_cowork python3 tests/test_cowork_companion_http_auth.py
      - name: Verify on-demand requests to CC Desktop and fetching files from authorised folders
        run: python3 tests/test_cowork_companion_requests.py
      - name: Verify the Express readback (openings, ledger, VAT records, changes against pushes, keep only the latest)
        run: python3 tests/test_cowork_readback.py
      - name: Verify folder auto-intake rules and that it only adds to existing paths
        run: python3 tests/test_cowork_folder_intake.py
      - name: Verify POS exports become one cash sale per day with a transfer voucher per non-cash payment
        run: python3 tests/test_cowork_pos_import.py
      - name: Verify every CC Desktop refusal code and push reason has text in the reader's language
        run: python3 tests/test_cowork_reason_language.py
      - name: Verify a batch of scheduled tasks saves all or nothing
        run: python3 tests/test_cowork_folder_task_batch.py
      - name: Verify scheduled-task reminders the day before and results briefs after a run
        run: python3 tests/test_cowork_folder_reminders.py
      - name: Verify company masters, branches, team notes, saved choices and pending documents for CC
        run: python3 tests/test_cowork_companies.py
      - name: Verify MR.ERP scheduled tasks and the folder sync reply
        run: python3 tests/test_cowork_folder_tasks_mrerp.py
      - name: Verify the scheduled-task field fixes
        run: PYTHONPATH=apps/pearnly_cowork:apps/pearnly_core python3 tests/test_cowork_scheduled_task_fixes.py
      - name: Verify delete removes every record and stored file
        run: python3 tests/test_cowork_delete_everything.py
      - name: Verify re-pushed scheduled-task documents carry the task defaults and leave the account set memory alone
        run: python3 tests/test_cowork_push_fixed.py
      - name: Verify expense account suggestions (the user's note, the supplier's usual account, names) and the account history read
        run: python3 tests/test_cowork_account_suggest.py
      - name: Verify a push takes its direction from the chosen account set's tax ID when the workspace's cannot tell
        run: python3 tests/test_cowork_push_direction.py
      - name: Verify the helper installer receiver refuses anything but one verified installer
        run: python3 tests/test_companion_receiver.py
      - name: Verify the pearnly.com website builds with complete SEO tags and working links
        run: python3 tests/test_website.py
      - name: Verify the assistant base (contracts, tool declarations, per-key agent provisioning)
        run: python3 tests/test_assistant.py
      - name: Verify product sites keep people signed in for 30 days unless an administrator chose otherwise
        run: python3 tests/test_account_session_length.py
      - name: Verify product sites do not send Python tracebacks to the page (System Settings allow_error_traceback off)
        run: python3 tests/test_desk_error_detail.py
      - name: Verify the fatcc.com entry (lookup, private billing, Keycloak client, generated sign-in pages)
        run: python3 tests/test_assistant_entry.py
      - name: Verify the Cowork assistant tools (declarations, translations, push request keys, filters)
        run: python3 tests/test_cowork_assistant_tools.py
      - name: Keep the old Windows app names out of what users and CC read (only CC Desktop, CC calls itself CC)
        run: python3 tests/test_cc_desktop_name.py
      - name: Verify the P.P.30 draft boxes and the input tax checks
        run: python3 tests/test_cowork_tax_pp30.py
      - name: Verify the P.N.D.3 / P.N.D.53 drafts (forms, payment dates, certificates, attachment sheets)
        run: python3 tests/test_cowork_tax_wht.py
      - name: Verify the tax draft service, its permissions and the withholding certificate references
        run: python3 tests/test_cowork_tax_service.py
      - name: Verify the Cowork team permission catalog
        run: python3 tests/test_cowork_team_menu.py
      - name: Verify the stock count page shows its stored UTC times in the site time zone
        run: python3 tests/test_cowork_stocktake_desk_time.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/assistant/package-lock.json
      - name: Type-check and build the assistant frontend (ADR-019)
        run: npm ci --prefix frontend/assistant && npm --prefix frontend/assistant run build
      - name: Verify the assistant page notices, push opt-in, deep links and scheduled tasks page
        run: python3 tests/test_assistant_ui.py
      - name: Verify the CC working line stays until the turn really ends, says when the connection is lost, and scrolling and IME Enter behave
        run: python3 tests/test_cc_run_indicator.py
      - name: Verify CC phone content interactions (notes Save/Cancel, open long chats at the newest message)
        run: python3 tests/test_cc_mobile_content.py
      - name: Keep CC colors, radii and shadows in globals.css only (ccs, official Claude style variables)
        run: python3 scripts/check-frontend-tokens.py
      - name: Verify the CC frontend standards gate (sizes, spacing, type, layers, motion fail inside the completed-files list)
        run: python3 tests/test_cc_frontend_gate.py
      - name: Keep dvh / svh / lvh behind a vh fallback (Chrome and Android WebView before 108 drop the whole declaration)
        run: python3 scripts/check-frontend-viewport-units.py
      - name: Verify CC phone overlays (dialogs fit and scroll, the back key closes the top layer, long-press rows, menus inside the screen)
        run: python3 tests/test_cc_mobile_overlays.py
      - name: Verify the ccs values match the official table and cards in the conversation follow the card rules
        run: python3 tests/test_cc_ccs.py
      - name: Verify the CC title bar, right session panel, company page and list pages (shell line B)
        run: python3 tests/test_cc_session_panel.py
      - name: Verify the month-end ledger card and company page section (digital accountant phase 1)
        run: python3 tests/test_cc_month_ledger.py
      - name: Verify offline DMS editor snapshot rendering
        run: |
          npm ci --prefix frontend
          node --test scripts/test-dms-editor-snapshot.cjs
      - name: Verify native Desk lifecycle
        run: node tests/test-native-desk.cjs
      - name: Verify Desk list refresh (push first, timed fallback)
        run: node --test tests/test-desk-live.cjs
      - name: Verify the Desk text cache
        run: node --test tests/test-desk-texts.cjs
      - name: Verify the narrow-screen breadcrumb menu lists each destination once
        run: node --test tests/test-desk-breadcrumbs.cjs
      - name: Verify every page uses the official Frappe sound for each kind of action
        run: node --test tests/test-desk-sounds.cjs
      - name: Verify long text fields wrap in product forms
        run: node --test tests/test-wrap-data.cjs
      - name: Verify the DMS connection page (read and write accounts)
        run: node tests/test-dms-connect-page.cjs
      - name: Verify native POS entry and lifecycle
        run: node --test tests/test_pos_lifecycle.js
      - name: Verify the pearnly.com free tools (baht text, VAT, withholding tax, tax ID)
        run: node --test tests/test-website-tools.cjs
      - name: Verify product list selection and deletion
        run: |
          node tests/test-roster-selection.cjs
          node tests/test-records-selection.cjs
      - name: Verify Cowork original upload (direct to Cloud Storage or through the server)
        run: node --test tests/test-upload-original.cjs
      - name: Verify the Cowork intake list status column
        run: node tests/test-intake-status.cjs
      - name: Verify the push choice dialog puts suggested accounts first and saves only on Save
        run: node --test tests/test-push-choice-suggest.cjs
      - name: Verify Desk retry actions
        run: node scripts/production/test-issue-actions.cjs
      - name: Verify welcome email contracts
        run: python3 tests/test_welcome_email.py
      - name: Verify purchase amount contracts
        run: python3 tests/test_purchase_amounts.py
      - name: Verify the shared tax document rules (ADR-0012)
        run: python3 tests/test_tax_documents.py
      - name: Verify abbreviated tax invoices read without VAT are saved with the included VAT split out
        run: python3 tests/test_cowork_abb_vat_included.py
      - name: Verify the Revenue Department tax ID lookup (real responses, shared by ERP and CC)
        run: python3 tests/test_erp_tax_lookup.py
      - name: Check generated translations
        run: python3 scripts/i18n-build.py --check
      - name: Block hard-coded Chinese or Thai interface text
        run: python3 scripts/check-i18n.py --strict
      - name: Verify the interface copy gate catches known explanatory copy and passes official copy
        run: python3 tests/test_check_copy.py
      - name: Keep new and changed interface copy short and official (changed copy needs the user's go-ahead)
        env:
          # PR：合并提交的第一个父提交就是 GitHub 实际合并到的 base（payload 里的 base.sha 可能已过时）；推 main：event.before
          COPY_GATE_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: python3 scripts/check-copy.py --report --out "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Check frontend translation keys
        run: python3 scripts/check-frontend-i18n.py --strict
      - name: Check whitespace
        run: git diff --check
