name: Development checks

on:
  pull_request:
  push:
    # main 只快进到任务分支上已检查通过的同一个提交（.githooks/pre-push 认这个提交的检查结果），不再重跑一遍
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  architecture-and-offline:
    # 仓库变量 DEV_RUNS_ON=pearnly-arm 时在自己的 free-arm-2（三个 runner，不计 GitHub 分钟数）上跑；
    # 那台出问题时删掉这个变量就回到 GitHub 的机器，不用改代码
    runs-on: ${{ vars.DEV_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # 界面文案闸门要读基线（merge-base origin/main）那一版的文案
          fetch-depth: 0
      - name: Test the architecture guard
        run: python3 tests/test_architecture_guard.py
      - name: Verify native Desk contracts
        run: python3 tests/test_native_desk_contract.py
      - name: Every whitelisted endpoint reaches a guard or is registered as own data or public
        run: python3 tests/test_unguarded_endpoints.py
      - name: The endpoints found without a permission check stay closed
        run: python3 tests/test_endpoint_guard_fixes.py
      - name: Product page heads only show declared buttons; tenant accounts never gain System Manager or change their own roles
        run: python3 tests/test_tenant_framework_roles.py && node tests/test-native-actions.cjs
      - name: Every page-head entry our code adds is declared on its own page in its product's pearnly_navigation actions
        run: python3 tests/test_check_entries.py && python3 scripts/check-entries.py
      - name: Team members added without an email get <login name>.<site prefix>@pearnly.com, a typed email must be valid
        run: python3 tests/test_team_placeholder_email.py
      - name: Every guest endpoint is registered with its reason and guard
        run: python3 tests/test_guest_endpoints.py
      - name: The page entry baselines are valid and compared by the agreed rules
        run: python3 tests/test_page_baseline.py
      - name: Download file names in Chinese or Thai are sent as RFC 5987 with an ASCII fallback
        run: python3 tests/test_download_filenames.py
      - name: Keep each ERP boot item independent of the others
        run: python3 tests/test_erp_boot_items.py
      - name: Verify ERP purchase lines remember their category by supplier and item
        run: python3 tests/test_erp_category_memory.py
      - name: ERP front desk to Express ledger, CC Desktop direct (payload from the shared rules, holds, pinned codes)
        run: python3 tests/test_erp_express_direct.py
      - name: Ledger changes sync at once (shared change shape, heartbeat ledger_changes and watch_books, ERP reads the changed company now, check-at-use)
        run: python3 tests/test_ledger_instant_sync.py
      - name: ERP collections written to Express as receipts (only money-receiving kinds offered, reservations, release by the shown version, withdraw, rights, receipts, snapshot, read-only page)
        run: python3 tests/test_erp_collection.py
      - name: ERP collections in LINE (fourth menu tile, company / customer search / invoice multi-select / methods and amounts / voucher / combined, discount and partial / confirm card, release by the shown version by button or typed word, withdraw, rights, result replied or pushed to the collector)
        run: python3 tests/test_erp_collection_line.py
      - name: Master search rules shared by the pickers, LINE supplier / customer search and LINE collection customer search (columns match each DocType's search fields)
        run: python3 tests/test_master_search_rules.py
      - name: ERP collections in CC chat (erp_collection_* tools on the collection service, release through the write plan after the user's next message, changed after said back not written, stop, operator conversation keeps the draft, slip from a chat attachment, rights, withdraw, results)
        run: python3 tests/test_erp_collection_cc.py
      - name: ERP collection guided in CC (form guide over the shared engine, decided steps, read-back facts, amounts held to what can be collected now, slips per transfer, review, consent by the click, sent-back steps, changed drafts, dates outside the period)
        run: python3 tests/test_erp_collection_guide.py
      - name: ERP purchase and sales guide product functions (intake by the business direction, recognition state, review face and edits back onto the record, direct confirm inside the conversation, unclicked payment held, results by ledger state)
        run: python3 tests/test_erp_guide_documents.py
      - name: CC attention rule (someone looking at the conversation is not called, away devices expire, any device is enough, push decides before sending)
        run: python3 tests/test_cc_attention.py
      - name: Verify LINE numbered choice buttons stay distinct within 20 characters (shared line_ui.labels and every ERP caller)
        run: python3 tests/test_line_choice_labels.py
      - name: ERP write precheck gathers every pre-write choice in one pass, recommends with a reason, remembers through the document page checks and leaves the write path unchanged
        run: python3 tests/test_erp_write_precheck.py
      - name: ERP operator submenu choice, the remembered menu text and the paid route in the operator payload, the submenu item read from the stored receipt in the precheck, remembered per company, account set and document type, and the write rules unchanged
        run: python3 tests/test_erp_operator_menu_choice.py
      - name: ERP operator in-between Express box, the box read from the stored receipt as one card item, the chosen button remembered per company and fingerprint and sent to the holding computer, and the remembered answers in the operator payload
        run: python3 tests/test_erp_operator_dialog_choice.py
      - name: ERP printing follows the issue slip and receipt note templates (rules here, layout in the candidate checks)
        run: python3 tests/test_erp_printing.py
      - name: Every print format names a PDF generator, so the native print page Get PDF link does not carry pdf_generator=None
        run: python3 tests/test_print_formats_pdf.py
      - name: Two PDFs made at once in one web process no longer fail on the framework default print font (hook registered here, the concurrent parse in the candidate checks)
        run: python3 tests/test_pdf_css_threads.py
      - name: Purchase vouchers attach in a retried short transaction with the PDF made once outside it, and an empty company line prints nothing (layout in the candidate checks)
        run: python3 tests/test_erp_purchase_voucher.py
      - name: ERP purchases have no purchase order kind any more; old callers land on a kept kind
        run: python3 tests/test_erp_purchase_order_retired.py
      - name: Verify migrations, schedulers and Express sync never check the company against the current account
        run: python3 tests/test_erp_system_paths_company_scope.py
      - name: Stock entry attachments take only the clerk's own fresh uploads, at most ten, kept once submitted
        run: python3 tests/test_erp_stock_attachments.py
      - name: Stock summary and card fold initialization into the opening, price lines like MR.ERP from one company pool and show category and attribute after the name
        run: python3 tests/test_opening_report.py
      - name: Every test under tests/ is run by CI or registered with a reason (orphan baseline only shrinks)
        run: python3 scripts/check-test-coverage.py && python3 tests/test_check_test_coverage.py
      - name: Offline unit tests found unrun on 11-09 that need no third-party packages
        run: python3 scripts/run-offline-tests.py --plain
      - name: Stock card export follows the MR.ERP receipt-issue reports (all warehouses, summary, by warehouse)
        run: python3 tests/test_erp_stock_card_export.py
      - name: CC Desktop shared machine channel (register, routing, writer lock, receipts, on-demand requests)
        run: python3 tests/test_cc_desktop_channel.py
      - name: MR.ERP logins are authorized in CC Desktop (one-time tickets, exact machine POST, no password back, logins on the computer row)
        run: python3 tests/test_mrerp_cc_login.py
      - name: MR.ERP passwords are no longer taken on web pages (CC page and Cowork Desk use the authorization component)
        run: python3 tests/test_mrerp_login_pages.py
      - name: MR.ERP masters are read whole from its own export pages and stock-by-warehouse report into the Express masters shape (fixed request count, unreadable is an error)
        run: python3 tests/test_mrerp_master_export.py
      - name: MR.ERP operator draft golden samples (four document kinds, fixed input to fixed block) and the staging that shares direct-write preparation
        run: python3 tests/test_mrerp_operator_draft.py
      - name: MR.ERP import sheets keep the printed line amounts, the tax rate of a goods purchase and the document discount, and the listed amount is checked after the write
        run: python3 tests/test_mrerp_import_amounts.py
      - name: Express operator shared rules match CC Desktop, and the trial comparison report puts the three methods side by side
        run: python3 tests/test_express_operator_shared.py
      - name: MR.ERP operator on CC Desktop reads the MR.ERP list the same way as the server-side import readback
        run: python3 tests/test_mrerp_operator_readback_parity.py
      - name: Express operator tasks are visible only to their creator, settle from product receipts and list server-side
        run: python3 tests/test_express_operator_tasks.py
      - name: Code-style CC backend, task upload records and their recognition states, pending counts per company and month, and the account set each precheck writes to
        run: python3 tests/test_express_operator_code_cc.py
      - name: Review card faces and marks (tax ID, branch, amounts, lines and dates marked not blocked, only what cannot go into Express blocks, a fixed cell clears its mark, only a confirmed unchanged ticket is written)
        run: python3 tests/test_review_card.py
      - name: CC writes only after the user says go to a server write plan (whole operator list, a message after the plan, unchanged documents, no start after a stop, direct push only from a started plan)
        run: python3 tests/test_write_plan.py
      - name: A ticket entered before is checked against the ledger before CC asks (shared entry fills every document, unknown when no computer can tell, both products' CC Desktop channels)
        run: python3 tests/test_ledger_check.py
      - name: Lab-made CC Desktop computers stay online while a scenario runs (reported the products' own UTC way, judged online by both products' rules, more often than half the window)
        run: python3 tests/test_lab_online.py
      - name: Mac lab stacks (ERP and Cowork side by side for test PCs on the LAN) publish only the two web entries, and the test PC profile script reads pairing codes the CC Desktop way and gives back every place, channel and paused profile it took
        run: python3 tests/test_maclab.py && python3 tests/test_maclab_pc.py
      - name: Hands-on tasks as one conversation, the event source projects every task, document and reason state, replays the same, pushes only to the owner, and leaves product submit and status calls unchanged
        run: python3 tests/test_express_operator_feed.py
      - name: Express operator submenu choice, the payment text read as cash or transfer, the remembered menu text and pay route in the operator payload, and the submenu item in the precheck card
        run: python3 tests/test_express_operator_menu_choice.py
      - name: The four questions asked before a write start (unit, negative stock, sale cost, cash account) follow the same rules CC Desktop stops on, write only payload 21 keys, are remembered per book where agreed, and the operator mode never asks cost or cash
        run: python3 tests/test_express_book_questions.py
      - name: ERP master records synced from Express keep their identity fields
        run: python3 tests/test_erp_express_locks.py
      - name: ERP product internal code (typed for local products, the Express code for synced ones; scans, stocktake and the product template read it)
        run: python3 tests/test_erp_internal_code.py
      - name: ERP product category master and attribute / colour (dialog order, import and stock sheet columns, four language words)
        run: python3 tests/test_erp_product_attribute.py
      - name: ERP warehouse location lists for stock counts only, and each line's own warehouse (another company's refused, one-warehouse companies need none)
        run: python3 tests/test_erp_locations.py
      - name: Stock kept per product and warehouse only, existing located balances merged by replaying the movements with the same totals, rerun changes nothing
        run: python3 tests/test_erp_warehouse_only_migration.py
      - name: ERP products tracked by unit (register on receipt, pick on sale, void back through the unit ledger, opening registration)
        run: python3 tests/test_erp_serials.py
      - name: ERP product adjustment (mixed signs, hand-typed prices only to Express TK, a warehouse on each line, transfers one out one in, old count entries listed as adjustments)
        run: python3 tests/test_erp_stock_adjust.py
      - name: ERP per-line item and stock choice
        run: python3 tests/test_erp_line_item_choice.py
      - name: ERP recognised numbers are tidied at every entry
        run: python3 tests/test_erp_recognised_numbers.py
      - name: Scanned GS1 codes and GTIN lengths meet product barcodes (Data Matrix, DataBar, GS1-128, UPC and EAN forms)
        run: python3 tests/test_products_gs1.py
      - name: ERP task management (boards copied from Cowork) keeps Cowork's board rights, refuses people without it and shows only their boards
        run: python3 tests/test_erp_work.py
      - name: ERP sidebar and routes admit only roles the page's API admits (an admin without the post no longer sees stock pages it cannot open)
        run: python3 tests/test_erp_page_roles_match_api.py
      - name: Render the control-plane LINE setup guide with its screenshots
        run: python3 tests/test_control_line_guide.py
      - name: Onboarding readback checks the account profile layout new sites get
        run: python3 tests/test_site_step_profile_layout.py
      - name: Control-plane tenant list shows the username and products
        run: python3 tests/test_control_tenant_list_summary.py
      - name: Verify each product declares its own feature catalog
        run: python3 tests/test_product_feature_catalog.py
      - name: Verify LIFF IDs are stored as IDs, not URLs
        run: python3 tests/test_liff_ids.py
      - name: Verify provisioning creates or corrects each tenant's LIFF on the shared LINE Login channel
        run: python3 tests/test_line_liff.py
      - name: Verify queued/reflected dotted targets resolve
        run: python3 tests/test_queue_targets.py
      - name: Verify Claude recognition route rules and escalation (ADR-022)
        run: python3 tests/test_claude_ocr_rules.py
      - name: Verify Claude OCR reads long files in segments to the last page
        run: python3 tests/test_claude_ocr_segments.py
      - name: Verify the ledger guard holds documents whose money does not close, on every direct write path
        run: PYTHONPATH=apps/pearnly_cowork:apps/pearnly_core python3 tests/test_ledger_guard.py
      - name: Verify a file added to a document is read again with its original and replaces it without a new document
        run: python3 tests/test_cowork_into_document.py
      - name: An upload whose original store is briefly unreachable answers a retry sentence instead of a server error
        run: python3 tests/test_cowork_upload_deferred.py
      - name: Verify the operator AI takeover forwards only whitelisted model calls within a batch budget
        run: python3 tests/test_express_operator_ai.py
      - name: Verify every Anthropic call on a site is recorded once in the usage ledger with its cost
        run: python3 tests/test_ai_usage.py
      - name: Verify the Claude self-check consistency table and its recorded real misses
        run: python3 tests/test_claude_ocr_consistency.py
      - name: Verify the Oracle claude-ocr bundle ships every shared package the engine imports
        run: python3 tests/test_claude_ocr_deploy_bundle.py
      - name: Verify DMS queue and reply-token call contracts
        run: python3 scripts/test-dms-call-contracts.py
      - name: Verify exact DMS customer identity before automatic writes
        run: python3 scripts/test-dms-customer-identity.py
      - name: Enforce architecture boundaries
        run: python3 scripts/check-architecture.py
      - name: Every catch in product front-end code rethrows or goes to the shared error report; expected ones are registered with a reason
        run: python3 scripts/check-swallowed-errors.py && python3 tests/test_check_swallowed_errors.py
      - name: Changed product entry files must be covered by a registered flow case (the flows themselves run in the local regression lab)
        env:
          FLOWS_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/main' }}
        run: python3 tests/test_flows_coverage.py && python3 tests/test_flows_lab_migrate.py && python3 tests/test_flows_run.py && python3 tests/test_flows_lab_worker.py && python3 tests/test_flows_github.py && python3 tests/test_flows_wait_values.py && python3 scripts/flows/coverage.py
      - name: Block new hand-written "which masters can this company see" conditions (baseline may only shrink)
        run: python3 scripts/check-master-scope.py && python3 tests/test_check_master_scope.py
      - name: Block new unbounded queries and full fetches sorted in the browser (baseline may only shrink)
        run: python3 scripts/check-unbounded-queries.py && python3 tests/test_check_unbounded_queries.py && python3 tests/test_list_filters.py && python3 tests/test_cowork_workbench_sort.py
      - name: Block new database queries inside loops (N+1; baseline may only shrink)
        run: python3 scripts/check-loop-queries.py && python3 tests/test_check_loop_queries.py
      - name: Every Express field CC desktop writes is registered (auto / guide card / review), and no new silent defaults on the write path (baseline may only shrink)
        run: python3 tests/test_express_required_coverage.py && python3 tests/test_mrerp_required_coverage.py && python3 scripts/check-express-defaults.py && python3 tests/test_check_express_defaults.py && python3 tests/test_express_rules_guided.py && python3 tests/test_write_precheck_guide.py && python3 tests/test_express_operator_guided_keys.py && python3 tests/test_cc_guide_tool.py
      - name: Block new code that reads a person's name itself instead of the shared display name (baseline may only shrink)
        run: python3 scripts/check-person-names.py && python3 tests/test_check_person_names.py
      - name: Form columns stay balanced, one kind per column, paired fields on one row (baseline may only shrink)
        run: python3 scripts/check-form-layout.py && python3 tests/test_check_form_layout.py
      - name: A Select field that may be saved empty has a blank first option, or its exception says why it is never empty
        run: python3 scripts/check-select-blank.py && python3 tests/test_check_select_blank.py
      - name: ERP and Cowork field descriptions sit in the info icon beside the label, not below the field (exceptions may only shrink)
        run: python3 scripts/check-field-help.py && node --test tests/test-desk-field-help.cjs
      - name: Shared link boxes send new and advanced search to our pages, and carry the scan button the product or the field asks for
        run: node tests/test-link-options.cjs
      - name: Endpoints reachable by GET do not write (Frappe does not commit GET requests; the mobile stocktake lookup lost its rows this way)
        run: python3 scripts/check-get-writes.py && python3 tests/test_check_get_writes.py
      - name: List queries use only arguments the locked Frappe takes (get_all / get_list with for_update raised TypeError and broke deleting documents, 11-16)
        run: python3 tests/test_frappe_list_kwargs.py
      - name: Pages call whitelisted endpoints with the HTTP method the endpoint declares (the Express connect dialog posted to a GET-only endpoint and popped no-permission every 3 seconds)
        run: python3 scripts/check-http-methods.py && python3 tests/test_check_http_methods.py && node --test tests/test-intake-targets-online.cjs
      - name: A ternary's else branch that uses || or ?? is parenthesised (unit registration lost scanned numbers to this precedence)
        run: python3 scripts/check-mixed-ternary.py && python3 tests/test_check_mixed_ternary.py && node --test tests/test-serials-register.cjs
      - name: LINE button labels are at most 20 characters in every language (LINE cuts longer ones; a cut word is a defect)
        run: python3 scripts/check-line-labels.py && python3 tests/test_check_line_labels.py
      - name: Verify MR.ERP master defaults are read from the company, never hard-coded
        run: python3 tests/test_cowork_mrerp_masters.py
      - name: MR.ERP rules shared in pearnly_core import no product and reach the network only from the session and the import; Cowork push preparation stays pure
        run: python3 tests/test_mrerp_core_boundary.py && python3 tests/test_cowork_push_purity.py
      - name: Write precheck rules shared in pearnly_core (card groups, one question per item across documents, decided, proposed and open, answers per document, preselect rules) import no framework or product
        run: python3 tests/test_write_precheck.py
      - name: LINE asks the write precheck questions before the card (quick replies, numbered lists, search, recommendation only when tapped, stale buttons, one ticket at a time)
        run: python3 tests/test_write_precheck_line_ask.py
      - name: Cowork write precheck collects every decision at once, preselects, remembers through the existing stores and keeps the hands-on precheck answer
        run: python3 tests/test_cowork_write_precheck.py
      - name: Exercise audited offline DMS contracts
        run: python3 scripts/check-dms-offline.py
      - name: Verify forced SSH provisioning entry and contracts
        run: python3 scripts/production/test-provision-agent.py
      - name: Verify provisioning points the LINE webhook at the tenant
        run: python3 scripts/production/test-site-step-webhook.py
      - name: Verify provisioning writes the shared OCR budget and Document AI regions
        run: python3 scripts/production/test-site-step-capacity.py
      - name: Verify tenant teardown deletes only its own originals in Cloud Storage
        run: python3 scripts/production/test-site-step-purge.py
      - name: Verify which identity pool a site may sign in to (old Cowork sites move and roll back)
        run: python3 scripts/production/test-site-step-oidc.py
      - name: Verify the read-only count of Cowork documents stopped for no computer to write them
        run: python3 scripts/production/test-count-cowork-no-writer.py
      - name: Verify the stand-in switch time is stamped once by the migration and old jobs keep waiting for their submitter
        run: python3 tests/test_cc_writer_rule.py
      - name: Verify a new tenant runs the after migrate initializers once its features are written
        run: python3 tests/test_site_initializers.py
      - name: Verify production memory admission budgets
        run: python3 scripts/check-production-capacity.py
      - name: Verify drained product activation and failure boundary
        run: python3 scripts/production/test-activate-product.py
      - name: Verify the one-command production deployment keeps every gate and stops at the first failure
        run: python3 scripts/production/test-deploy-run.py
      - name: Verify the deploy readback reports a LIFF endpoint off the site root and a LINE entry that ends in 404
        run: python3 scripts/production/test-check-liff-endpoints.py
      - name: Verify the pre-deploy tenant config check blocks same and shape differences, only reports presence, and keeps secrets inside the container
        run: python3 scripts/production/test-check-tenant-config.py
      - name: Verify the pre-deploy external settings check (Keycloak, LINE, fatcc.com registry, DNS, certificates) blocks same and shape differences and a missing entry registration, and no secret or digest leaves the host
        run: python3 scripts/production/test-check-external-config.py
      - name: Verify the post-deploy entry check walks each formal tenant's must-verify entries (LIFF, plain address, CC entry)
        run: python3 scripts/production/test-check-tenant-entries.py
      - name: Verify migrations stop when DocTypes disappear
        run: python3 scripts/production/test-doctype-guard.py
      - name: Verify the deploy gate inherits a full flow suite only across non-product changes
        run: python3 scripts/production/test-flows-inherit.py
      - name: Verify DMS bench runtime configuration
        run: python3 scripts/production/test-dms-runtime.py
      - name: Verify ERP bench runtime configuration
        run: python3 scripts/production/test-erp-runtime.py
      - name: Verify the ERP masters lane can be handed back to the long queue on rollback
        run: python3 scripts/production/test-requeue-erp-masters.py
      - name: Verify the read-only count of queued ERP write jobs whose owner has no computer
        run: python3 scripts/production/test-count-erp-queued-no-computer.py
      - name: Verify the cleanup of never-used auto-built companies only deletes with the confirmed plan
        run: python3 scripts/production/test-purge-unused-ledger-companies.py
      - name: Verify the daily offsite backup and restore drill contracts
        run: python3 scripts/production/test-offsite-backup.py
      - name: Verify the Windows helper and the server agree on endpoints, pairing code and downloads
        run: python3 tests/test_companion_contract.py
      - name: Verify an operator task carrying the four new-item keys is stamped by the server and creates the item with them in CC
        run: python3 tests/test_operator_guided_keys_contract.py
      - name: Verify any account set on the computer gets its chart read on demand and choices wait for it
        run: python3 tests/test_cowork_any_set_catalog.py
      - name: Verify read-only connection views take no row locks and write paths still lock
        run: python3 tests/test_cowork_connection_read_locks.py
      - name: Verify the companion machine envelope and its method tables (push, folder, on-demand requests, computers)
        run: PYTHONPATH=apps/pearnly_cowork python3 tests/test_cowork_companion_http_auth.py
      - name: Verify CC Desktop credential values (token shape, both active-key formulas, receipts, retired management RPCs)
        run: PYTHONPATH=apps/pearnly_cowork python3 tests/test_cowork_companion_credentials.py
      - name: Verify several computers per connection (register v2, digest authentication, device hello and leave, old-computer patch)
        run: python3 tests/test_cowork_cc_desktop_devices.py
      - name: Verify the account-set register, reach and facts of a pool (identity rules, union directory, refresh hand-out, patch, full reports written in batches)
        run: python3 tests/test_cowork_express_account_sets.py
      - name: Verify Express write dispatch across computers (routing, lease v2, lock scheme v2, evidence v2, pool state)
        run: python3 tests/test_cowork_express_dispatch.py && python3 tests/test_cowork_express_wait.py && PYTHONPATH=apps/pearnly_cowork:apps/pearnly_core python3 tests/test_cowork_express_preflight.py && PYTHONPATH=apps/pearnly_cowork:apps/pearnly_core python3 tests/test_cowork_push_native_contract.py
      - name: Verify MR.ERP operator jobs on the Cowork channel (constant off never looks, chosen computer only, account lease, redelivery, receipts; Express unchanged with it on)
        run: python3 tests/test_cowork_mrerp_operator_dispatch.py
      - name: Verify heartbeats keep masters per account set and never rewrite the connection every minute
        run: python3 tests/test_cowork_report_writes.py && python3 tests/test_cowork_account_caches.py && python3 tests/test_cowork_preparation_dynamic.py
      - name: Verify on-demand requests to CC Desktop and fetching files from authorised folders
        run: python3 tests/test_cowork_companion_requests.py
      - name: Verify the Express readback (openings, ledger, VAT records, changes against pushes, keep only the latest)
        run: python3 tests/test_cowork_readback.py
      - name: Verify folder auto-intake rules and that it only adds to existing paths
        run: python3 tests/test_cowork_folder_intake.py
      - name: Verify every term the CC scheduled tasks page asks for has English, Chinese, Thai and Japanese
        run: python3 tests/test_cc_scheduled_task_terms.py
      - name: Verify POS exports become one cash sale per day with a transfer voucher per non-cash payment
        run: python3 tests/test_cowork_pos_import.py
