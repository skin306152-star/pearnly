name: Development checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  architecture-and-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test the architecture guard
        run: python3 tests/test_architecture_guard.py
      - name: Verify native Desk contracts
        run: python3 tests/test_native_desk_contract.py
      - name: Keep each ERP boot item independent of the others
        run: python3 tests/test_erp_boot_items.py
      - name: Verify ERP purchase lines remember their category by supplier and item
        run: python3 tests/test_erp_category_memory.py
      - name: Render the control-plane LINE setup guide with its screenshots
        run: python3 tests/test_control_line_guide.py
      - name: Verify each product declares its own feature catalog
        run: python3 tests/test_product_feature_catalog.py
      - name: Verify LIFF IDs are stored as IDs, not URLs
        run: python3 tests/test_liff_ids.py
      - name: Verify queued/reflected dotted targets resolve
        run: python3 tests/test_queue_targets.py
      - name: Verify DMS queue and reply-token call contracts
        run: python3 scripts/test-dms-call-contracts.py
      - name: Verify exact DMS customer identity before automatic writes
        run: python3 scripts/test-dms-customer-identity.py
      - name: Enforce architecture boundaries
        run: python3 scripts/check-architecture.py
      - name: Exercise audited offline DMS contracts
        run: python3 scripts/check-dms-offline.py
      - name: Verify forced SSH provisioning entry and contracts
        run: python3 scripts/production/test-provision-agent.py
      - name: Verify provisioning points the LINE webhook at the tenant
        run: python3 scripts/production/test-site-step-webhook.py
      - name: Verify provisioning writes the shared OCR budget and Document AI regions
        run: python3 scripts/production/test-site-step-capacity.py
      - name: Verify production memory admission budgets
        run: python3 scripts/check-production-capacity.py
      - name: Verify drained product activation and failure boundary
        run: python3 scripts/production/test-activate-product.py
      - name: Verify the Windows helper and the server agree on endpoints, pairing code and downloads
        run: python3 tests/test_companion_contract.py
      - name: Verify the helper installer receiver refuses anything but one verified installer
        run: python3 tests/test_companion_receiver.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify offline DMS editor snapshot rendering
        run: |
          npm ci --prefix frontend
          node --test scripts/test-dms-editor-snapshot.cjs
      - name: Verify native Desk lifecycle
        run: node tests/test-native-desk.cjs
      - name: Verify the DMS connection page (read and write accounts)
        run: node tests/test-dms-connect-page.cjs
      - name: Verify native POS entry and lifecycle
        run: node --test tests/test_pos_lifecycle.js
      - name: Verify product list selection and deletion
        run: |
          node tests/test-roster-selection.cjs
          node tests/test-records-selection.cjs
      - name: Verify Cowork original upload (direct to Cloud Storage or through the server)
        run: node --test tests/test-upload-original.cjs
      - name: Verify Desk retry actions
        run: node scripts/production/test-issue-actions.cjs
      - name: Verify welcome email contracts
        run: python3 tests/test_welcome_email.py
      - name: Verify purchase amount contracts
        run: python3 tests/test_purchase_amounts.py
      - name: Verify the shared tax document rules (ADR-0012)
        run: python3 tests/test_tax_documents.py
      - name: Check generated translations
        run: python3 scripts/i18n-build.py --check
      - name: Check whitespace
        run: git diff --check
