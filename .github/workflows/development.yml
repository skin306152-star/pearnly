        run: python3 scripts/i18n-build.py --check
      - name: Block hard-coded Chinese or Thai interface text
        run: python3 scripts/check-i18n.py --strict
      - name: Verify the interface copy gate catches known explanatory copy and passes official copy
        run: python3 tests/test_check_copy.py
      - name: Keep new and changed interface copy short and official (changed copy needs the user's go-ahead)
        env:
          # PR：合并提交的第一个父提交就是 GitHub 实际合并到的 base（payload 里的 base.sha 可能已过时）；推 main：event.before
          COPY_GATE_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: python3 scripts/check-copy.py --report --out "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Verify the shared-part impact gate lists every entry and rejects unregistered callers
        run: python3 tests/test_check_impact.py
      - name: List the entries to retest for changed shared parts (fails when a caller is not registered)
        env:
          IMPACT_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: python3 scripts/check-impact.py --markdown --out "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Product map discovers every entry kind and checks each row's values, references and test strength
        run: python3 tests/test_product_map.py
      - name: Product map gate (every entry registered, still in the code and tested on each end; untested baseline only shrinks) and the entries this change touches
        env:
          PRODUCT_MAP_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: python3 tests/test_check_product_map.py && python3 scripts/check-product-map.py --markdown --out "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Post-login end-to-end runner keeps passwords out of output, never retries a rejected login and reports a test tenant on the test PC as not tested
        run: python3 tests/test_e2e_runner.py
      - name: Verify the shared scanner shows the camera picture and reads a test barcode in a real browser
        env:
          SMOKE_CHROME: /usr/bin/google-chrome
        run: python3 scripts/smoke/selftest.py && python3 tests/test_smoke_flow_fields.py
      - name: The scanner reports only real errors; a refused camera, a camera missing or busy and LINE or app browsers only show their hint
        run: node tests/test-scan-report.cjs
      - name: Smoke runs leave no headless Chrome or temporary profile behind, even when the driver times out or is interrupted
        run: python3 tests/test_smoke_chrome_cleanup.py
      - name: Verify browser errors on product pages reach the site's error log
        run: |
          python3 tests/test_client_errors.py
          node tests/test-desk-errors.cjs
      - name: Check frontend translation keys
        run: python3 scripts/check-frontend-i18n.py --strict
      - name: Check whitespace
        run: git diff --check
