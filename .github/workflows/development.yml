      - name: Verify product list filters offer only the conditions their servers apply (equals, between)
        run: node tests/test-desk-list-filter.cjs
      - name: Verify the Desk text cache
        run: node --test tests/test-desk-texts.cjs
      - name: Verify the narrow-screen breadcrumb menu lists each destination once
        run: node --test tests/test-desk-breadcrumbs.cjs
      - name: Verify the intake edit page address follows the invoice shown when another invoice of the same original is opened
        run: node --test tests/test-intake-follow-route.cjs
      - name: Verify switching records clears the page head menu, refused detail pages show the native not permitted page, and the header warehouse leads the lines
        run: node --test tests/test-desk-place-and-switch.cjs
