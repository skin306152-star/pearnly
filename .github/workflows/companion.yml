name: Companion checks

# Windows 小助手（companion/）的测试：它的测试按 Windows 写（UNC 路径、Win32 文件锁），所以在 Windows 上跑全量。
# 服务端与小助手之间的约定另在 Development checks（tests/test_companion_contract.py）里，每次推送都跑。
on:
  pull_request:
    paths: ['companion/**', '.github/workflows/companion*.yml']
  push:
    paths: ['companion/**', '.github/workflows/companion*.yml']

permissions:
  contents: read

jobs:
  companion-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the pinned build and test dependencies
        run: python -m pip install --quiet --no-deps -r packaging/requirements-build.txt
      - name: Run the helper tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests
