name: Companion checks

# Windows 小助手（companion/）的测试：它的测试按 Windows 写（UNC 路径、Win32 文件锁），所以在 Windows 上跑全量。
# 服务端与小助手之间的约定另在 Development checks（tests/test_companion_contract.py）里，每次推送都跑。
on:
  pull_request:
    paths: ['companion/**', '.github/workflows/companion*.yml']
  push:
    paths: ['companion/**', '.github/workflows/companion*.yml']

permissions:
  contents: read

jobs:
  companion-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the pinned build and test dependencies
        run: python -m pip install --quiet --no-deps -r packaging/requirements-build.txt
      - name: Run the helper tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests
      # 2026-10-10 起带 Tomo 窗口（网页内核）打成文件夹：每次都真打一次包，核对网页内核进了包；
      # 安装包只作为这次运行的附件（1 天，Actions 存储额度只有 0.5 GB，一个包约 150 MB），不发布，供测试机试装。正式发布仍走 companion-release.yml（只发 main）。
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer (not published)
        shell: pwsh
        env:
          RELEASE_PY: python
          RELEASE_ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: powershell -ExecutionPolicy Bypass -File packaging\release.ps1 -BuildOnly
      - name: Check the Tomo window's web engine is in the package
        shell: pwsh
        run: |
          $engine = Get-ChildItem dist\companion -Recurse -Filter QtWebEngineProcess.exe | Select-Object -First 1
          if (-not $engine) { throw 'QtWebEngineProcess.exe is missing from the package' }
          $mb = [math]::Round((Get-Item dist\CC-Setup.exe).Length / 1MB, 1)
          Write-Host "web engine: $($engine.FullName) · installer: $mb MB"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: companion-installer-test
          path: |
            companion/dist/CC-Setup.exe
            companion/dist/release.json
          retention-days: 1
          if-no-files-found: error
