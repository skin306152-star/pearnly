# 站外写入点登记（scripts/check-external-writes.py 守门；11-28 菜单随部署同步任务）。
# 生产代码里每个「调 LINE / Keycloak / Cloudflare 且带写动词」的函数必须在这里登记一条，说明它随部署怎么保持与代码一致：
#   deploy-sync  每次部署自动同步并回读（必须是 hooks pearnly_line_surfaces 声明的模块）
#   drift-check  部署不重写，但部署前 / 后有内容级检查、对不上即拦部署（note 写哪一项检查）
#   runtime      按事件 / 按人写，内容由当前代码现算或与代码版本无关
#   token / probe  换令牌 / 只读校验接口，不改站外设置
#   teardown     拆租户时删除
#   manual       只能人手、纳入不了（note 必须写原因与谁来做）
# 新增这类函数而不登记、登记了但函数已不在，都会被拦。

