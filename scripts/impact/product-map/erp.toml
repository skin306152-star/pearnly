channel = "desk"
ends = ["mobile"]
kind = "scan"
anchor = "scan:erp.serials.dialog"
where = "按台管理：入库 / 出库 / 调拨 / 进货 / 销售收据 / 收银提交前的「登记车辆 / 选择车辆」弹窗：商品开按台 → 入库「其他」提交 → 逐行登记车架号（扫码填号）；出库、调拨、销售收据、收银完成订单 → 选在库的台（下拉搜索、扫码认台）；入库「退货」→ 选已售的台；取消弹窗；同一台车放在同仓另一个库位再选"
parts = ["desk-scan-core", "erp-scan-dialog"]
tests = ["flow:erp.stock-in.units@mobile", "impact:erp.serials.dialog"]

