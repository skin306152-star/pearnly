# 产品地图（Cowork）：用户能碰到的入口，一行一个（字段与规则见 scripts/impact/product_map.py、scripts/check-product-map.py，
# 评估与审定 docs/work/2026-11-04-product-map.md）。锚点由发现器从代码读出；新入口同一提交里登记并写测试，
# `python3 scripts/check-product-map.py --suggest` 出草稿。tests 只写引用：flow:<流程 id>[@desktop|@mobile]、
# impact:<shared-parts 入口 id>、unit:<测试文件>[::<名字>]。只有打开冒烟、页面快照、人工清单的不算有测试。

