product = "ERP"
where = "收银跨天退货写 Express 退货单 SR"
steps = "接 Express 的公司收银卖一张（等当天日汇总 HS 写进 C 盘 T 账套），次日退其中一部分（现金退一张、PromptPay 退一张）；跑 express.pos_day.nightly 或等定时；收银记录页看退货小票的 Express 列与弹窗；在 Express 里改过原 HS 金额后再退一张；退得比原单多一张"
expect = "按原 HS 分张写成 Express 原生退货单 SR（ARTRN RECTYP 5、CNTYP 3、SONUM = 原 HS、IVCAMT = 原单合计、RCVAMT = 退款）：借退货科目 / 借销项税 / 贷现金、借存货 / 贷成本，STCRD POSOPR 2、RETSTK Y、RDOCNUM 指原单行、成本按原单那一行，货回原仓（STMAS / STLOC），ISVAT RECTYP 5 正数，ARMAS.BALANCE 冲减；退货科目第一次弹窗选、之后自动带；PromptPay 退款另记一张「借现金 / 贷收款科目」凭证；原单找不到 / 金额被改过 / 没有这一行 / 退超停在人工（REFUND_*）；读回一致；旧版 CC 桌面版不接（载荷 10）"
check = "manual"
files = ["companion/src/companion/dbf_refund.py", "apps/pearnly_erp_portal/pearnly_erp_portal/express/pos_day.py"]

