# 共用件连带回归登记表（scripts/check-impact.py 读；规则见 docs/development/verification.md「共用件连带回归闸门」）
#
# [[part]]：一个共用件。paths = 它自己的文件（glob）；markers = 调用方文件里一定会出现的字面串（子串匹配）；
#   search = 反查调用方时扫哪些文件（默认 apps / frontend / companion / infrastructure）；entries = 改了它要实测的入口；
#   not_entries = 引用了它但不算入口的文件（只转发、只是注释、加载声明），必须写原因。
# [[entry]]：一个入口。check = auto（scripts/smoke 自动）/ manual（验收窗口按清单点）/ offline（离线用例覆盖）；
#   files = 这个入口用到的调用方文件（反查出的调用方必须落在某个入口的 files 里，否则 CI 失败）；
#   smoke / url / args / site = 自动冒烟的探针、地址、参数、测试租户（erp / cowork / dms）。
# 新加调用方、新页面、新扫码 / 上传入口：同一提交里补进来。

