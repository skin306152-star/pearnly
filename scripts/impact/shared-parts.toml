name = "CC 对话页设置页"
paths = ["frontend/assistant/src/components/settings.tsx"]
markers = ["from \"@/components/settings\"", "openSettings("]
search = ["frontend/assistant/src/**"]
entries = ["cc.settings.connection", "cc.desktop.bridge"]

[[part]]
id = "cc-desktop-bridge"
name = "CC 对话页与桌面版的桥"
paths = ["frontend/assistant/src/lib/desktop.ts", "companion/src/companion/tomo_bridge.py"]
markers = ["from \"@/lib/desktop\"", "tomo_bridge"]
search = ["frontend/assistant/src/**", "companion/src/**"]
entries = ["cc.desktop.bridge", "cc.settings.connection"]

[[part]]
id = "cc-places-heartbeat"
name = "CC 位置、成员记录与心跳"
paths = ["companion/src/companion/express_places.py", "companion/src/companion/express_machine.py", "companion/src/companion/profile_store.py", "companion/src/companion/master_refresh.py"]
markers = ["express_places", "express_machine", "profile_store", "master_refresh"]
search = ["companion/src/**"]
entries = ["cc.desktop.places", "cc.desktop.requests"]

[[part]]
id = "cc-request-worker"
name = "CC 按需读取"
paths = ["companion/src/companion/request_worker.py", "companion/src/companion/request_client.py", "companion/src/companion/request_contract.py", "companion/src/companion/express_read.py", "companion/src/companion/express_masters.py", "companion/src/companion/account_history.py", "companion/src/companion/folder_fetch.py"]
markers = ["request_worker", "request_client", "request_contract", "express_read", "express_masters", "account_history", "folder_fetch"]
search = ["companion/src/**"]
entries = ["cc.desktop.requests", "cc.desktop.places"]

[[part]]
id = "cc-dbf-write"
name = "CC 写 Express（dbf 写入路径）"
paths = ["companion/src/companion/dbf_writer.py", "companion/src/companion/dbf_sales.py", "companion/src/companion/dbf_detail.py", "companion/src/companion/pos_journal.py", "companion/src/companion/master_create.py", "companion/src/companion/product_master.py", "companion/src/companion/stock_purchase.py", "companion/src/companion/stock_sale.py", "companion/src/companion/write_verify.py", "companion/src/companion/account_write_lock.py", "companion/src/companion/purchase_adapter.py", "companion/src/companion/sales_adapter.py", "companion/src/companion/purchase_lines.py", "companion/src/companion/stock_location.py", "companion/src/companion/dbf_fields.py", "companion/src/companion/dbf_schema.py", "companion/src/companion/payload_contract.py", "companion/src/companion/unit_code.py", "companion/src/companion/write_result.py"]
markers = ["dbf_writer", "dbf_sales", "dbf_detail", "pos_journal", "master_create", "product_master", "stock_purchase", "stock_sale", "write_verify", "account_write_lock", "purchase_lines", "stock_location"]
search = ["companion/src/**"]
entries = ["cc.desktop.write", "cowork.cc.channel", "erp.cc.write"]
not_entries = { "companion/src/companion/express_read.py" = "读路径只借用写入的字段常量，入口见 cc-request-worker" }

