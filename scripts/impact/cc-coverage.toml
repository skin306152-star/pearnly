# CC 覆盖总表的引导侧（总设计 docs/work/2026-11-14-cc-guided-master-design.md 第 4 节；总表 docs/work/2026-11-12-cc-coverage-matrix.md 第 8 节由本文件生成）。
# 行 = 业务；四组 = Cowork 直写 / Cowork 代录 / ERP 直写 / ERP 代录；每组三格按 本地 Express · MR.ERP · 云端 Express（格号见总表第 1 节）。
# 与账本无关的业务一组只写一格。
# 一格的写法：
#   done            引导做完：声明完整（题、复核、确定、结果都在卡上），且登记了真页面点卡从题到结果的流程（link.page_flows）
#   half:<期>       做了一半：已声明、服务端能走，页面整条（题 → 复核 → 确定 → 结果）还没有流程证据
#   todo:<期>       范围内、没有引导（现在靠打字能办）
#   no:<期>:<等谁>  范围内、打字也办不了（等谁：desktop = CC 桌面版）
#   wait:mrerp / wait:cloud / wait:onboard   等 MR.ERP 写账线 / 云端 Express / 公司接入（线开没开见下面 [line]）
#   out:<依据>      范围外
# 依据（11-22 起）：每个 done / half 的格在所在行下写一条 [[row.link]]：cell = "组.账本"（一格的组只写组），basis = 这格凭什么这么标，
#   flows / page_flows = 流程 id（tests/flows/registry.toml），model / device = 真模型 / 真机依据（"acc:<验收场景>" 跑过的、
#   "真机记录:<行 id>" docs/work 下固定格式通过的、"docs/work/<文件>::<原文片段>" 非固定格式的记录），scenarios = 登记了还没跑过的验收场景。
# 闸门 scripts/check-cc-coverage.py 双向核：声明了的格标低了（todo / no / 线开着还 wait、完整引导有页面流程还 half）拦，
#   标高了没证据（done / half 没声明、done 没页面流程、线关着）拦；引导相关的流程 / 真机记录 / 验收场景都要登记到某一格；
#   相对 origin/main 分叉点改了引导声明或引导流程，本文件必须同一分支一起改。改完跑 --write 重新生成总表那一段。

# 账本线开没开：一组写 "open"、"closed:<为什么>"，或一串 "路径:常量名"（全为 True 才算开）。线关着的格只能标 wait 或 out。
[line.mrerp]
cowork_direct = "open"
cowork_operator = ["apps/pearnly_core/pearnly_core/express_operator/contracts.py:MRERP_OPERATOR_ENABLED"]
erp_direct = ["apps/pearnly_erp_portal/pearnly_erp_portal/mrerp/__init__.py:MRERP_LEDGER_ENABLED"]
erp_operator = ["apps/pearnly_erp_portal/pearnly_erp_portal/mrerp/__init__.py:MRERP_LEDGER_ENABLED",
                "apps/pearnly_core/pearnly_core/express_operator/contracts.py:MRERP_OPERATOR_ENABLED"]

[line.cloud]
cowork_direct = "closed:云端 Express 来源是占位、不取数（b0f007927），T1–T6 只读实测没过"
cowork_operator = "closed:云端 Express 来源是占位、不取数（b0f007927），T1–T6 只读实测没过"
erp_direct = "closed:云端 Express 来源是占位、不取数（b0f007927），T1–T6 只读实测没过"
erp_operator = "closed:云端 Express 来源是占位、不取数（b0f007927），T1–T6 只读实测没过"

