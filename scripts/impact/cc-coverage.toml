# CC 覆盖总表的引导侧（总设计 docs/work/2026-11-14-cc-guided-master-design.md 第 4 节；总表 docs/work/2026-11-12-cc-coverage-matrix.md 第 8 节由本文件生成）。
# 行 = 业务；四组 = Cowork 直写 / Cowork 代录 / ERP 直写 / ERP 代录；每组三格按 本地 Express · MR.ERP · 云端 Express（格号见总表第 1 节）。
# 与账本无关的业务一组只写一格。
# 一格的写法：
#   done            引导做完（题、复核、确定、结果都在卡上）
#   half:<期>       做了一半（有题卡，复核 / 结果 / 开始卡没并）
#   todo:<期>       范围内、没有引导（现在靠打字能办）
#   no:<期>:<等谁>  范围内、打字也办不了（等谁：desktop = CC 桌面版）
#   wait:mrerp / wait:cloud / wait:onboard   等 MR.ERP 写账线 / 云端 Express 实测 / 公司接入
#   out:<依据>      范围外
# 闸门 scripts/check-cc-coverage.py：写法合规；标 done / half 的格必须有对应的引导声明（done 还要是完整引导）；有声明的格不许标 out / no；
# 总表里的表与本文件一致（改这里后跑 --write 重新生成）。

