<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pearnly LINE 本地实测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#202025;font:15px system-ui}header{padding:18px 24px;background:white;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header strong{font-size:18px}header small{color:#656575}button,input,select{font:inherit;border:1px solid #ddd;border-radius:8px;padding:9px;background:white}button{cursor:pointer}button:hover{background:#eee8ff}main{max-width:760px;margin:auto;height:calc(100vh - 140px);overflow:auto;padding:20px}article{background:white;border-radius:18px;padding:15px;margin:14px 0;max-width:94%;box-shadow:0 1px 3px #0001;overflow-wrap:anywhere}article.mine{margin-left:auto;background:#b8f28b;max-width:70%}.box{display:flex;gap:10px;padding:7px 0}.vertical{flex-direction:column}.horizontal{align-items:center}.flextext{white-space:pre-wrap;min-width:0}.flexbutton{width:100%;margin:4px 0;color:#6234d3}.bubble{border:1px solid #ececf1;border-radius:12px;padding:12px}.separator{border-top:1px solid #eee;margin:8px 0}.carousel{display:flex;gap:12px;overflow:auto}.carousel>.bubble{min-width:300px}.timestamp{display:block;font-size:11px;color:#777;margin-top:10px}footer{display:flex;gap:8px;position:fixed;bottom:0;width:100%;background:white;padding:12px max(16px,calc((100vw - 760px)/2));border-top:1px solid #ddd}footer input[type=text]{flex:1;min-width:0}#status{color:#734ade}#upload{display:none}img{max-width:100%}pre{white-space:pre-wrap;font-size:11px}dialog{border:1px solid #ddd;border-radius:12px;padding:24px}a{color:#6340bb}
#richmenu{position:fixed;bottom:65px;right:20px;width:min(500px,90vw);aspect-ratio:2500/1686;background-size:100% 100%;z-index:2;box-shadow:0 0 5px #bbb}#richmenu button{position:absolute;background:transparent;border:0;border-radius:0;color:transparent}#richmenu button:hover{background:#734ade15}
</style>
<header><strong>Pearnly · LINE 本地实测</strong><select id="person"><option value="Ulab-alice">操作员 Alice</option><option value="Ulab-bob">操作员 Bob</option></select><button id="follow">首次关注</button><button id="menu">呼出菜单</button><button id="richToggle">底部菜单</button><small>LINE 平台为模拟；业务后端、数据库和队列为真实本地服务。第三方结果另行回读。</small><span id="status"></span></header>
<main id="messages"></main><aside id="richmenu" hidden></aside>
<footer><button id="image">图片</button><input id="upload" type="file" accept="image/*"><input id="text" type="text" placeholder="输入绑定码或对话内容" autocomplete="off"><button id="send">发送</button></footer>
<dialog id="dateDialog"><form method="dialog"><p>选择日期</p><input id="date" type="date" required><button value="ok">确定</button><button value="cancel" formnovalidate>取消</button></form></dialog>
<script>
const $=id=>document.getElementById(id);let cursor=0, polling=false;
async function send(data){$('status').textContent='正在投递签名事件…';try{const r=await fetch('/__lab/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('person').value,...data})});const b=await r.json();if(!r.ok)throw Error(JSON.stringify(b));$('status').textContent='事件已交给后端';await poll()}catch(e){$('status').textContent='投递失败：'+e.message}}
async function action(a){if(!a)return;if(a.type==='postback')return send({postback:a.data});if(a.type==='message')return send({text:a.text});if(a.type==='datetimepicker'){$('dateDialog').showModal();$('dateDialog').onclose=()=>{if($('dateDialog').returnValue==='ok')send({postback:a.data,params:{date:$('date').value}})};}if(a.type==='uri'){const u=new URL(a.uri);if(u.hostname==='liff.line.me'||u.pathname==='/liff/dms-booking'){u.searchParams.set('user',$('person').value);window.open('/__lab/editor?'+u.searchParams,'_blank','noopener')}else window.open(a.uri,'_blank','noopener')}}
function node(x){if(!x)return document.createElement('span');let el=document.createElement('div');if(x.type==='text'){el.className='flextext';el.textContent=x.text||'';if(x.weight==='bold')el.style.fontWeight='700';if(x.color)el.style.color=x.color;if(x.action){el.style.cursor='pointer';el.onclick=()=>action(x.action)}}else if(x.type==='button'){el=document.createElement('button');el.className='flexbutton';el.textContent=x.action?.label||'操作';el.onclick=()=>action(x.action)}else if(x.type==='image'){el=document.createElement('img');el.src=x.url;el.alt='卡片图片';if(x.action)el.onclick=()=>action(x.action)}else if(x.type==='separator')el.className='separator';else if(x.type==='bubble'){el.className='bubble';for(const part of ['header','hero','body','footer'])if(x[part])el.append(node(x[part]))}else{el.className=x.type==='carousel'?'carousel':'box '+(x.layout||'vertical');for(const c of x.contents||[])el.append(node(c));if(x.action){el.style.cursor='pointer';el.onclick=()=>action(x.action)}}return el}
function message(m){let art=document.createElement('article');if(m.type==='text')art.textContent=m.text;else if(m.type==='flex')art.append(node(m.contents));else if(m.type==='image'){const i=document.createElement('img');i.src=m.originalContentUrl;art.append(i)}else art.textContent=JSON.stringify(m);if(m.quickReply){const row=document.createElement('div');row.className='box horizontal';row.style.flexWrap='wrap';for(const item of m.quickReply.items||[])row.append(node({type:'button',action:item.action}));art.append(row)}return art}
async function poll(){if(polling)return;polling=true;const user=$('person').value;try{const r=await fetch('/__lab/messages?user='+encodeURIComponent(user)+'&after='+cursor);const rows=await r.json();if(user!==$('person').value)return;for(const row of rows){cursor=Math.max(cursor,row.id);if(row.kind==='loading'){$('status').textContent='后端处理中 · 已收到 LINE loading 请求';continue}if(row.kind==='incoming'){const e=row.body.event;const art=document.createElement('article');art.className='mine';art.textContent=e.message?.text||(e.message?.type==='image'?'已上传图片':e.postback?.data||e.type);$('messages').append(art)}else if(row.kind==='outgoing'){for(const m of row.body){const art=message(m);const t=document.createElement('small');t.className='timestamp';t.textContent=new Date(row.created*1000).toLocaleTimeString();art.append(t);$('messages').append(art)}$('status').textContent='后端已回复'}}if(rows.length)$('messages').scrollTop=$('messages').scrollHeight}catch(e){$('status').textContent='读取回复失败：'+e.message}finally{polling=false}}
$('richToggle').onclick=async()=>{const el=$('richmenu');if(!el.hidden){el.hidden=true;return;}const data=await(await fetch('/__lab/richmenu?user='+encodeURIComponent($('person').value))).json();el.replaceChildren();if(!data.areas){$('status').textContent='尚未发布底部菜单';return;}el.style.backgroundImage='url('+data.image+')';for(const area of data.areas){const b=document.createElement('button');b.textContent=area.action.label||'菜单';b.title=b.textContent;b.style.left=area.bounds.x/25+'%';b.style.top=area.bounds.y/16.86+'%';b.style.width=area.bounds.width/25+'%';b.style.height=area.bounds.height/16.86+'%';b.onclick=()=>{el.hidden=true;action(area.action)};el.append(b);}el.hidden=false;};
$('send').onclick=()=>{const text=$('text').value.trim();if(text){$('text').value='';send({text})}};$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('follow').onclick=()=>send({event:'follow'});$('menu').onclick=()=>send({text:'เมนู'});$('person').onchange=()=>{$('richmenu').hidden=true;cursor=0;$('messages').replaceChildren();poll()};$('image').onclick=()=>$('upload').click();$('upload').onchange=()=>{const file=$('upload').files[0];$('upload').value='';if(file){const reader=new FileReader();reader.onload=()=>send({image:reader.result.split(',')[1],mime:file.type});reader.readAsDataURL(file)}};setInterval(poll,1200);poll();
</script>
