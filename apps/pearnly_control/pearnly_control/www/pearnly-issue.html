{% extends "templates/web.html" %}
{% block title %}{{ _("Issue") }}{% endblock %}
{% block page_content %}
<style>
  .pi-wrap{max-width:760px;margin:2rem auto;font-size:14px;color:#111827}
  .pi-wrap h3{margin:0 0 4px}
  .pi-sub{color:#6b7280;margin:0 0 20px}
  .pi-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px}
  .pi-card h5{margin:0 0 12px;font-size:14px;color:#374151}
  .pi-row{display:flex;gap:12px;flex-wrap:wrap}
  .pi-field{flex:1 1 200px;margin-bottom:12px}
  .pi-field label{display:block;margin-bottom:5px;color:#374151}
  .pi-field input,.pi-field textarea{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
  .pi-hint{color:#9ca3af;font-size:12px;margin-top:4px}
  .pi-app{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .pi-app input[type=checkbox]{width:16px;height:16px}
  .pi-app .name{width:96px;color:#374151}
  .pi-app input[type=text]{flex:1;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px}
  .pi-app input[type=text]:disabled{background:#f9fafb;color:#9ca3af}
  .pi-actions{display:flex;gap:10px;align-items:center}
  .pi-actions button{padding:10px 22px;border:0;border-radius:9px;background:#6d5bd0;color:#fff;font-size:14px;cursor:pointer}
  .pi-actions button[disabled]{opacity:.6;cursor:default}
  .pi-msg{color:#dc2626;min-height:18px}
  .pi-result{display:none}
  table.pi-list{width:100%;border-collapse:collapse;margin-top:8px}
  table.pi-list th,table.pi-list td{border-bottom:1px solid #eef2f7;padding:7px 6px;text-align:left;font-size:13px}
  table.pi-list th{color:#6b7280;font-weight:500}
</style>

<div class="pi-wrap">
  <h3>{{ _("Issue") }}</h3>
  <p class="pi-sub"><span id="pi-operator"></span></p>

  <div class="pi-card" id="pi-form-card">
    <h5>{{ _("issue.section.account") }}</h5>
    <div class="pi-field">
      <label>{{ _("Provisioning Target") }}</label>
      <select id="pi-target" style="width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font-size:14px"></select>
    </div>
    <div class="pi-row">
      <div class="pi-field">
        <label>{{ _("Company Name") }}</label>
        <input type="text" id="pi-tenant" placeholder="{{ _("issue.placeholder.company") }}">
      </div>
      <div class="pi-field">
        <label>{{ _("Email") }}</label>
        <input type="text" id="pi-email" placeholder="owner@company.com">
      </div>
    </div>
    <div class="pi-row">
      <div class="pi-field">
        <label>{{ _("Username") }}</label>
        <input type="text" id="pi-username" placeholder="{{ _("issue.placeholder.username") }}">
      </div>
      <div class="pi-field">
        <label>{{ _("Initial Password") }}</label>
        <input type="text" id="pi-password">
      </div>
    </div>
  </div>

  <div class="pi-card">
    <h5>{{ _("issue.section.products") }}</h5>
    <div class="pi-app">
      <input type="checkbox" id="pi-app-cowork" data-app="cowork">
      <span class="name">Cowork</span>
      <input type="text" id="pi-dom-cowork" placeholder="{{ _("issue.placeholder.prefix") }}" disabled>
    </div>
    <div class="pi-app">
      <input type="checkbox" id="pi-app-erp" data-app="erp">
      <span class="name">ERP</span>
      <input type="text" id="pi-dom-erp" placeholder="{{ _("issue.placeholder.prefix") }}" disabled>
    </div>
    <div class="pi-app">
      <input type="checkbox" id="pi-app-dms" data-app="dms">
      <span class="name">DMS</span>
      <input type="text" id="pi-dom-dms" placeholder="{{ _("issue.placeholder.prefix") }}" disabled>
    </div>
  </div>

  <div class="pi-card">
    <div class="pi-field">
      <label>{{ _("Remarks") }}</label>
      <textarea id="pi-notes" rows="2"></textarea>
    </div>
    <div class="pi-actions">
      <button id="pi-submit">{{ _("Create") }}</button>
      <span class="pi-msg" id="pi-msg"></span>
    </div>
  </div>

  <div class="pi-card pi-result" id="pi-result">
    <h5>{{ _("issue.section.result") }}</h5>
    <div id="pi-result-body"></div>
  </div>
</div>

<script>
  // 页面不承载数据：身份与 CSRF 令牌都从这个需要登录的接口取。
  // 未登录时它会报错，前端据此跳登录页。
  var CSRF = "";
  var APPS = ["cowork", "erp", "dms"];

  fetch("/api/method/pearnly_control.issues.api_context")
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || !res.j || !res.j.message) {
        // 控制面用**本地账号**登录，不接统一身份
        window.location.href = "/login?redirect-to=/pearnly-issue";
        return;
      }
      CSRF = res.j.message.csrf_token;
      document.getElementById("pi-operator").textContent = "当前操作人：" + res.j.message.operator;
      var sel = document.getElementById("pi-target");
      (res.j.message.targets || []).forEach(function (t) {
        var o = document.createElement("option");
        o.value = t.target_name;
        o.textContent = t.target_name + "（" + t.base_url + "）";
        if (t.is_default) o.selected = true;
        sel.appendChild(o);
      });
      if (!sel.options.length) {
        document.getElementById("pi-msg").textContent = "还没有配置开户目标（Pearnly Target），请先配一个";
      }
    })
    .catch(function () {
      window.location.href = "/login?redirect-to=/pearnly-issue";
    });

  APPS.forEach(function (app) {
    var cb = document.getElementById("pi-app-" + app);
    var dom = document.getElementById("pi-dom-" + app);
    cb.addEventListener("change", function () {
      dom.disabled = !cb.checked;
      if (cb.checked && !dom.value) {
        var tenant = (document.getElementById("pi-tenant").value || "acme")
          .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "acme";
        dom.value = tenant + "-" + app;
      }
      if (!cb.checked) dom.value = "";
    });
  });

  function collect() {
    var apps = [];
    APPS.forEach(function (app) {
      if (document.getElementById("pi-app-" + app).checked) {
        apps.push({ app: app, domain_prefix: document.getElementById("pi-dom-" + app).value.trim() });
      }
    });
    return {
      target: document.getElementById("pi-target").value,
      tenant_name: document.getElementById("pi-tenant").value.trim(),
      account_email: document.getElementById("pi-email").value.trim(),
      account_username: document.getElementById("pi-username").value.trim(),
      account_password: document.getElementById("pi-password").value,
      notes: document.getElementById("pi-notes").value.trim(),
      apps: apps
    };
  }

  function errText(j) {
    if (j && j._server_messages) {
      try { return JSON.parse(JSON.parse(j._server_messages)[0]).message || "服务器拒绝"; }
      catch (e) { return "服务器拒绝"; }
    }
    return (j && (j.exception || j.exc_type)) || "未知错误";
  }

  document.getElementById("pi-submit").addEventListener("click", function () {
    var btn = this, msg = document.getElementById("pi-msg"), label = btn.dataset.label || (btn.dataset.label = btn.textContent);
    msg.textContent = "";
    var body = collect();
    if (!body.tenant_name) { msg.textContent = "请填公司名称"; return; }
    if (!body.account_email) { msg.textContent = "请填邮箱"; return; }
    if (!body.account_username) { msg.textContent = "请填用户名"; return; }
    if (!body.account_password) { msg.textContent = "请填初始密码"; return; }
    if (!body.apps.length) { msg.textContent = "至少要选一个产品"; return; }
    if (body.apps.some(function (a) { return !a.domain_prefix; })) {
      msg.textContent = "每个选中的产品都要填域名前缀"; return;
    }

    btn.disabled = true; btn.textContent = "提交中…";
    fetch("/api/method/pearnly_control.issues.api_issue", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": CSRF },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        btn.disabled = false; btn.textContent = label;
        if (!j || !j.message || !j.message.issue) { msg.textContent = errText(j); return; }
        render(j.message);
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = label;
        msg.textContent = "失败：" + e;
      });
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render(m) {
    var rows = m.deployments.map(function (d) {
      return "<tr><td>" + esc(d.app) + "</td><td>" + esc(d.domain) +
             "</td><td>待开通</td></tr>";
    }).join("");
    var feats = Object.keys(m.features || {})
      .filter(function (p) { return (m.features[p] || []).length; })
      .map(function (p) { return p + " " + m.features[p].length + " 项"; })
      .join("；");

    document.getElementById("pi-result-body").innerHTML =
      "<div>发号单：<b>" + esc(m.issue) + "</b>　租户：<b>" + esc(m.tenant) + "</b></div>" +
      "<div style='margin-top:4px'>开户目标：<b>" + esc(m.target || "-") + "</b></div>" +
      "<div style='margin-top:6px'>邮箱：<b>" + esc(m.account_email) + "</b>　用户名：<b>" + esc(m.account_username) + "</b></div>" +
      "<div style='margin-top:6px'>已开通功能：" + esc(feats || "-") + "</div>" +
      "<div style='margin-top:6px'>身份主体：" + esc([m.identity_subject, m.cowork_identity_subject].filter(Boolean).join(" / ")) + "</div>" +
      "<table class='pi-list'><tr><th>产品</th><th>域名</th><th>状态</th></tr>" + rows + "</table>";
    document.getElementById("pi-result").style.display = "block";
  }
</script>
{% endblock %}
