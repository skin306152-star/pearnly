{% extends "templates/web.html" %}
{% block title %}密码更改{% endblock %}
{% block page_content %}
<div class="pearnly-pw" style="max-width:420px;margin:2rem auto;">
  <h3>密码更改</h3>
  <p class="text-muted">三个产品共用同一个入口，改的是统一账号的密码。</p>
  <div class="form-group">
    <label>当前密码</label>
    <input type="password" class="form-control" id="pw-current" autocomplete="current-password">
  </div>
  <div class="form-group">
    <label>新密码</label>
    <input type="password" class="form-control" id="pw-new" autocomplete="new-password">
  </div>
  <div class="form-group">
    <label>确定新密码</label>
    <input type="password" class="form-control" id="pw-confirm" autocomplete="new-password">
  </div>
  <button class="btn btn-primary" id="pw-submit">确定</button>
  <div id="pw-msg" style="margin-top:1rem;"></div>
</div>
<script>
  var CSRF = "{{ csrf_token }}";
  document.getElementById("pw-submit").addEventListener("click", function () {
    var msg = document.getElementById("pw-msg");
    msg.textContent = "提交中…";
    fetch("/api/method/pearnly_core.password.change_password", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": CSRF },
      body: JSON.stringify({
        current_password: document.getElementById("pw-current").value,
        new_password: document.getElementById("pw-new").value,
        confirm_password: document.getElementById("pw-confirm").value
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.j && res.j.message && res.j.message.ok) {
          msg.textContent = "已修改。下次登录请用新密码。";
        } else {
          msg.textContent = "失败：" + JSON.stringify(res.j && (res.j._server_messages || res.j.exc_type || res.j));
        }
      })
      .catch(function (e) { msg.textContent = "失败：" + e; });
  });
</script>
{% endblock %}
