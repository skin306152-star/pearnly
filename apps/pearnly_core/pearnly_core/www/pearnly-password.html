{% extends "templates/web.html" %}
{% block title %}{{ _("Change Password") }}{% endblock %}
{% block page_content %}
<div class="pearnly-pw" style="max-width:420px;margin:2rem auto;">
  <h3>{{ _("Change Password") }}</h3>
  <div class="form-group">
    <label for="pw-current">{{ _("Current Password") }}</label>
    <input type="password" class="form-control" id="pw-current" autocomplete="current-password">
  </div>
  <div class="form-group">
    <label for="pw-new">{{ _("New Password") }}</label>
    <input type="password" class="form-control" id="pw-new" autocomplete="new-password">
  </div>
  <div class="form-group">
    <label for="pw-confirm">{{ _("Confirm New Password") }}</label>
    <input type="password" class="form-control" id="pw-confirm" autocomplete="new-password">
  </div>
  <button class="btn btn-primary" id="pw-submit">{{ _("Update Password") }}</button>
  <div id="pw-msg" style="margin-top:1rem;"></div>
</div>
<script>
  var CSRF = "{{ csrf_token }}";
  var TEXT = {
    saving: {{ _("Saving...") | tojson }},
    done: {{ _("Password changed successfully.") | tojson }},
    failed: {{ _("Something went wrong") | tojson }}
  };
  // 服务端 frappe.throw 的提示在 _server_messages 里（已按用户语言翻译）：只取 message 的文字，不显示 JSON / exc_type
  function serverMessage(body) {
    try {
      var items = JSON.parse((body && body._server_messages) || "[]");
      var texts = items.map(function (item) {
        var message = JSON.parse(item).message || "";
        return new DOMParser().parseFromString(String(message), "text/html").body.textContent.trim();
      }).filter(Boolean);
      return texts.join(" ");
    } catch (e) {
      return "";
    }
  }
  document.getElementById("pw-submit").addEventListener("click", function () {
    var msg = document.getElementById("pw-msg");
    msg.textContent = TEXT.saving;
    fetch("/api/method/pearnly_core.password.change_password", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": CSRF },
      body: JSON.stringify({
        current_password: document.getElementById("pw-current").value,
        new_password: document.getElementById("pw-new").value,
        confirm_password: document.getElementById("pw-confirm").value
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.j && res.j.message && res.j.message.ok) {
          msg.textContent = TEXT.done;
        } else {
          msg.textContent = serverMessage(res.j) || TEXT.failed;
        }
      })
      .catch(function () { msg.textContent = TEXT.failed; });
  });
</script>
{% endblock %}
