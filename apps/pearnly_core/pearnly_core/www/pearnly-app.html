<!doctype html>
<!-- 旧产品地址转原生 Desk；只保留 LINE 票据编辑和本人 DMS 账号交接页。

     ⚠️ **这个文件会过 Frappe 的 Jinja 渲染**：所以正文里不能出现双层花括号
     （哪怕是写在注释里举例也不行 —— 注释照样被 Jinja 解析，直接抛模板语法错，
     整页 417。2026-09-19 踩过：一条说明里写了那对花括号，页面就打不开了）。
     要举例就写成 `花括号` 这种描述，别真写符号。

     资源标签**不抄在这里**：前端产物带内容哈希（`index.B0z1ErHN.js`），
     抄一份就得每次构建跟着改，忘一次就是白屏、还看不出原因。
     所以运行时去读产物里那份 index.html，把它的 script/link 原样搬过来。 -->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pearnly</title>
    <script>
      // 同步拿（XHR）：异步注入会让首屏先闪一下空壳。
      //
      // ⚠️ 不能用 innerHTML 塞标签：**innerHTML 建出来的 script/link 浏览器不会执行、
      // 也不会加载**（拿到的是被标记成"已启动"的空壳）。必须逐个 createElement 再设属性。
      (function () {
        var route = (location.hash.replace(/^#/, "") || location.pathname.replace(/^\/pearnly-app/, "") || "/home").split("?")[0].replace(/^\/|\/$/g, "");
        if (!["dms/editor", "dms/account", "dms/scan"].includes(route)) {
          var pages = {"home": "pearnly-home", "connect": "pearnly-connect", "records": "pearnly-records", "roster": "pearnly-roster", "intake": "pearnly-intake", "history": "pearnly-history", "push-logs": "pearnly-push-logs", "reconcile": "pearnly-reconcile", "stocktake": "pearnly-stocktake", "clients": "pearnly-clients", "company": "pearnly-company", "team": "pearnly-team", "integrations": "pearnly-integrations", "guide": "pearnly-guide", "products": "pearnly-products", "inventory": "pearnly-inventory", "stock-in": "pearnly-stock-in", "stock-out": "pearnly-stock-out", "stock-card": "pearnly-stock-card", "purchase": "pearnly-purchase", "suppliers": "pearnly-suppliers", "purchase-settings": "pearnly-buy-settings", "sales": "pearnly-sales"};
          location.replace("/desk/" + (pages[route] || "pearnly-home"));
          return;
        }
        var xhr = new XMLHttpRequest();
        // Only the small entry manifest bypasses cache; hashed JS/CSS stays cacheable.
        xhr.open("GET", "/assets/pearnly_core/pearnly-app/index.html?v=" + Date.now(), false);
        try { xhr.send(null); } catch (e) { return; }
        if (xhr.status !== 200) return;
        var html = xhr.responseText;
        var tags = /<(script|link)\b[^>]*>/gi;
        var attrRe = /([a-zA-Z-]+)="([^"]*)"/g;
        var tag;
        while ((tag = tags.exec(html)) !== null) {
          var raw = tag[0];
          var name = tag[1].toLowerCase();
          var attrs = {};
          var a;
          attrRe.lastIndex = 0;
          while ((a = attrRe.exec(raw)) !== null) attrs[a[1].toLowerCase()] = a[2];
          var el;
          if (name === "script") {
            if (!attrs.src) continue;
            el = document.createElement("script");
            el.src = attrs.src;
            if (attrs.type) el.type = attrs.type;
          } else {
            if (!attrs.href) continue;
            el = document.createElement("link");
            el.rel = attrs.rel || "stylesheet";
            el.href = attrs.href;
          }
          if ("crossorigin" in attrs) el.crossOrigin = "anonymous";
          document.head.appendChild(el);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
