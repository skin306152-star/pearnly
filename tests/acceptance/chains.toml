# 业务链（验收测试标准 §3.1 A10、A11）：一条链经过哪些地图行；chain 类场景用 chain = "<id>" 指过来。
# 第一期只登记示范用的一条；其余（方案 §3.2 的 W / P 系列）随各期补。

[[chain]]
id = "erp.purchase-to-express"
title = "ERP 采购单：提交 → 写进 Express → 单号回显 → 账本读回"
rows = ["erp.desk.pearnly-purchase.action.Submit", "erp.desk.pearnly-purchase.action.Express"]

[[chain]]
id = "erp.connect-to-masters"
title = "ERP 公司接入：从连接添加 → 接上 Express → 主档与账套资料落库（只读账本）"
rows = ["erp.desk.pearnly-company.action.company.connect.add"]

[[chain]]
id = "erp.sales-to-express"
title = "ERP 销售单：提交 → 写进 Express → 单号回显 → 账本读回"
rows = ["erp.desk.pearnly-sales.action.Submit", "erp.desk.pearnly-sales.action.Express"]

[[chain]]
id = "erp.collection-to-express"
title = "ERP 收款：发票读回 → 录收款（网页 / LINE / CC 对话）→ 写成 Express 收款单 → 账本读回（挂的发票、余额、凭证、银行流水）"
rows = ["erp.desk.pearnly-collections.action.New", "erp.line.postback.col", "erp.cc.tool.erp_collection_draft",
        "erp.cc.tool.erp_collection_push"]

[[chain]]
id = "erp.stock-in-to-express"
title = "ERP 入库单：提交 → 写进 Express → 账本读回"
rows = ["erp.desk.pearnly-stock-in.action.trade.action.submit"]

[[chain]]
id = "erp.stock-out-to-express"
title = "ERP 出库单：提交 → 写进 Express → 账本读回"
rows = ["erp.desk.pearnly-stock-out.action.trade.action.submit"]

[[chain]]
id = "erp.stock-adjust-to-express"
title = "ERP 物料调整单：提交 → 写进 Express → 账本读回"
rows = ["erp.desk.pearnly-stock-adjust.action.trade.action.submit"]

[[chain]]
id = "erp.stock-transfer-to-express"
title = "ERP 调拨单：提交 → 写进 Express → 账本读回"
rows = ["erp.desk.pearnly-stock-transfer.action.trade.action.submit"]

[[chain]]
id = "erp.stock-void-to-express"
title = "ERP 库存单作废：已写进 Express 的单作废 → 原单在账本里改成作废"
rows = ["erp.desk.pearnly-stock-in.action.trade.action.submit"]

[[chain]]
id = "erp.stocktake-to-express"
title = "ERP 盘点：结束 → 生成调整单 → 提交 → 写进 Express → 账本读回"
rows = ["erp.desk.pearnly-stock-count.action.stock.count.adjust", "erp.desk.pearnly-stock-adjust.action.trade.action.submit"]
