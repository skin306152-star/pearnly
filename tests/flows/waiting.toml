# 等接线的流程用例（11-16，P3 窗口）：模块已写好、还没在实验栈跑过，因为页面上的引导卡（分支 3 cc-guided-wire）与新输入
# （A2 guided-frontend：交文件、子题、结果文件）还没进 main。接线一进 main：搬进 registry.toml（同样的字段），单跑
# `run.py --flow <id>` 调好页面标记再提交。run.py 不读本文件。字段同 registry.toml，另有 waits（等什么）。

[[flow]]
id = "cowork.cc.guide.readback"
title = "Cowork CC 回读引导：账套 = 本对话 T.8 不问，只问月份 → 确定 → 结果卡（在读 / 电脑没来领），请求记在 T.8"
module = "scripts/flows/cowork_cc_guide_readback.py"
product = "cowork"
start = "/assistant"
user = "admin"
datasets = ["new"]
viewports = ["desktop", "mobile"]
waits = ["cc-guided-wire"]
covers = ["apps/pearnly_cowork/pearnly_cowork/assistant/guided/readback.py", "apps/pearnly_cowork/pearnly_cowork/assistant/readback_files.py"]

