guard = "盘点票据（as_ticket_user）+ 仓必须属于这份盘点的公司 + 库位清单的读权限（locations.api_location_options）"

[[guest]]
method = "pearnly_erp_portal.inventory.line_mobile.api_line_stocktake_undo"
reason = "手机盘点：撤销一笔"
guard = "盘点票据（as_ticket_user）"

[[guest]]
method = "pearnly_cowork.ocr.remote.callback.receive"
reason = "Cloud Run 识别服务的结果回调，发件方不是登录用户"
guard = "服务身份令牌校验（verify：回调地址 + 调用方）"

