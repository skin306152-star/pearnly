# 只在测试机上叠加；栈定义本身仍然只有 production/compose.yml 一份。
#
# 1) 正式 compose 用固定名 external 卷（pearnly-production_sites-*），这里换成测试项目
#    自己的卷。**卷名带项目名**：每个 app 一套栈（`pearnly-testenv-dms` / `-erp` / …），
#    各自的站点文件、数据库卷、Redis 卷完全分开，测一个产品不会碰到另一个。
#    数据库卷与队列卷在 production/compose.yml 里是非 external 的命名卷，Docker 本来就按
#    项目名隔离，这里不用重复声明。
# 2) 把本仓的测试辅助脚本只读挂进产品容器，用来建站点/迁移，不额外装东西。

volumes:
  sites-billing:
    external: true
    name: ${TESTENV_PROJECT:-pearnly-testenv}_sites-billing
  sites-dms:
    external: true
    name: ${TESTENV_PROJECT:-pearnly-testenv}_sites-dms
  sites-erp:
    external: true
    name: ${TESTENV_PROJECT:-pearnly-testenv}_sites-erp
  sites-cowork:
    external: true
    name: ${TESTENV_PROJECT:-pearnly-testenv}_sites-cowork

services:
  # 测试租户的身份走**线上** Keycloak（site_config 的 pearnly_oidc_issuer 指向
  # auth.pearnly.com），所以每套 app 栈默认不需要自己的 Keycloak。放到 keycloak
  # profile 里：只有要登那些空白的 <app>.test.localhost 站点时才显式启动。
  keycloak:
    profiles: [keycloak]
  billing-web:
    # 账本站点也要能整站导入（付费路径依赖它），所以和产品容器一样挂 testenv 与 import。
    volumes:
      - /opt/pearnly-testenv/deploy/infrastructure/testenv:/workspace/testenv:ro
      - /opt/pearnly-testenv/import:/workspace/import:ro
  dms-web:
    volumes:
      - /opt/pearnly-testenv/deploy/infrastructure/testenv:/workspace/testenv:ro
      - /opt/pearnly-testenv/import:/workspace/import:ro
  erp-web:
    volumes:
      - /opt/pearnly-testenv/deploy/infrastructure/testenv:/workspace/testenv:ro
      - /opt/pearnly-testenv/import:/workspace/import:ro
  cowork-web:
    volumes:
      - /opt/pearnly-testenv/deploy/infrastructure/testenv:/workspace/testenv:ro
      - /opt/pearnly-testenv/import:/workspace/import:ro
  # Cowork 识别与对账进程：测试机上各 4 个（线上 compose 各 2 个），压测十几套对账时不必排队等进程
  # （2026-09-29 用户要求压测提速；只改并行度，不改读法与结果）。测试机 10G 内存、6 核。
  cowork-ocr-worker:
    mem_limit: 4g
    command: [bench, worker-pool, --queue, 'ocr', --num-workers, '4']
  cowork-long-worker:
    mem_limit: 3g
    command: [bench, worker-pool, --queue, long, --num-workers, '4']
