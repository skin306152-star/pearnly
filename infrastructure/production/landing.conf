# pearnly.com：官网静态站 + Windows 小助手下载（装在 /etc/nginx/conf.d/pearnly-landing.conf）。
# 官网源码在 website/，由 scripts/publish-website.sh 构建并整体替换 /var/www/pearnly-landing；加 --nginx 同时安装本文件。总览视频在 media.pearnly.com（R2），不经这台机器。
# 手动安装：install -m 644 landing.conf /etc/nginx/conf.d/pearnly-landing.conf && sh reload-nginx.sh
# 下载目录由 receive-companion.py 写（CI 经受限 SSH 发布），这里只读、不列目录。
# 官网“税号查公司”的限流：每个 IP 每分钟 20 次，可短时多查 10 次（超出回 429）。放在 server 外面（conf.d 在 http 层里）。
limit_req_zone $binary_remote_addr zone=pearnly_rd:1m rate=20r/m;
server {
    listen 80;
    server_name pearnly.com www.pearnly.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://pearnly.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name pearnly.com www.pearnly.com;
    ssl_certificate /etc/letsencrypt/live/pearnly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pearnly.com/privkey.pem;
    server_tokens off;
    # 只留一个正式域名，避免搜索引擎把 www 和不带 www 当成两份重复内容。
    if ($host = www.pearnly.com) { return 301 https://pearnly.com$request_uri; }
    root /var/www/pearnly-landing;
    index index.html;
    error_page 404 /404.html;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    # 旧站（换成静态官网前）被搜索引擎收过的地址：有对应新页的永久跳过去，别让旧链接落到 404。
    # 旧站模板占位符（/{{ … }}）和旧登录接口本来就不是页面，保持 404。
    location = /home { return 301 /; }
    location = /ai { return 301 /cowork/; }
    location = /cashier { return 301 /erp/; }
    location = /pos { return 301 /erp/; }
    # 官网“税号查公司”（/tools/tax-id/）：浏览器 GET /api/rd/vat?tin=13位数字，nginx 拼好固定的 SOAP 请求，
    # 用税务局公开接口的匿名账号查 VAT 登记（/api/rd/tin 查税号是否存在）。只收 13 位数字、不转发浏览器的任何头和内容，
    # 不是开放代理；域名按请求时解析（DNS 一时不通也不影响 nginx 启动）。和 ERP 的 masters/rd_contracts.py 是同一份请求。
    location = /api/rd/vat {
        if ($arg_tin !~ "^[0-9]{13}$") { return 400; }
        limit_except GET { deny all; }
        limit_req zone=pearnly_rd burst=10 nodelay;
        limit_req_status 429;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 3s;
        set $rd_url https://rdws.rd.go.th/serviceRD3/vatserviceRD3.asmx;
        proxy_method POST;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host rdws.rd.go.th;
        proxy_set_header Content-Type "application/soap+xml; charset=utf-8";
        proxy_set_body '<?xml version="1.0" encoding="utf-8"?><soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope" xmlns:vat="https://rdws.rd.go.th/serviceRD3/vatserviceRD3"><soap:Header/><soap:Body><vat:Service><vat:username>anonymous</vat:username><vat:password>anonymous</vat:password><vat:TIN>$arg_tin</vat:TIN><vat:Name></vat:Name><vat:ProvinceCode>0</vat:ProvinceCode><vat:BranchNumber>0</vat:BranchNumber><vat:AmphurCode>0</vat:AmphurCode></vat:Service></soap:Body></soap:Envelope>';
        proxy_ssl_server_name on;
        proxy_ssl_name rdws.rd.go.th;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $rd_url;
    }
    location = /api/rd/tin {
        if ($arg_tin !~ "^[0-9]{13}$") { return 400; }
        limit_except GET { deny all; }
        limit_req zone=pearnly_rd burst=10 nodelay;
        limit_req_status 429;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 3s;
        set $rd_url https://rdws.rd.go.th/serviceRD3/checktinpinservice.asmx;
        proxy_method POST;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host rdws.rd.go.th;
        proxy_set_header Content-Type "application/soap+xml; charset=utf-8";
        proxy_set_body '<?xml version="1.0" encoding="utf-8"?><soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope" xmlns:chec="https://rdws.rd.go.th/serviceRD3/checktinpinservice"><soap:Header/><soap:Body><chec:ServiceTIN><chec:username>anonymous</chec:username><chec:password>anonymous</chec:password><chec:TIN>$arg_tin</chec:TIN></chec:ServiceTIN></soap:Body></soap:Envelope>';
        proxy_ssl_server_name on;
        proxy_ssl_name rdws.rd.go.th;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $rd_url;
    }
    # 样式与脚本带 ?v=内容哈希，图片极少变：缓存一周。
    location ^~ /static/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 小助手：固定名安装包、各版本安装包、latest.json（小助手每小时查一次更新）。每次都回源校验，不缓存旧版。
    location ^~ /downloads/companion/ {
        alias /var/www/pearnly-downloads/companion/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # 旧版小助手（v1.1.77 及更早）在这里查更新：给同一份 latest.json，让已装的旧版自动升到新版。
    location = /static/companion/latest.json {
        alias /var/www/pearnly-downloads/companion/latest.json;
        add_header Cache-Control "no-cache" always;
    }
}
