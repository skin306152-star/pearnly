# fatcc.com：CC（智能体）入口站点（ADR-019，2026-10-10 起用独立域名；装在 /etc/nginx/conf.d/pearnly-fatcc.conf）。
# 入口站点 fatcc.com 建在计费服务那套程序上（billing-web，本机 8184；只开放入口页与登录接口，见 assistant_entry/entry.py）。
# billing-web 只跑应用、不出静态文件：页面底部睡觉的猫（视频）由 Cowork 前端（8181，同一份镜像）出，只放行这一个目录。
# DNS：Cloudflare fatcc.com 区只解析不代理（同 pearnly.com），证书由本机 certbot 签发与续期。
# 手动安装：install -m 644 fatcc.conf /etc/nginx/conf.d/pearnly-fatcc.conf && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name fatcc.com www.fatcc.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://fatcc.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name fatcc.com www.fatcc.com;
    ssl_certificate /etc/letsencrypt/live/fatcc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fatcc.com/privkey.pem;
    server_tokens off;
    client_max_body_size 1m;
    if ($host = www.fatcc.com) { return 301 https://fatcc.com$request_uri; }
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/pearnly-timing.log pearnly_timing;
    location ^~ /assets/pearnly_control/cc/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host fatcc.com;
        expires 30d;
    }
    location / {
        proxy_pass http://127.0.0.1:8184;
        proxy_set_header Host fatcc.com;
        proxy_set_header X-Frappe-Site-Name fatcc.com;
        proxy_set_header X-Forwarded-Proto https;
        # 用本机看到的来源覆盖（不接客户端自带的 X-Forwarded-For，免得伪造）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
