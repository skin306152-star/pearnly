server {
    listen 80;
    listen [::]:80;
    server_name auth.pearnly.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/pearnly-acme; }
    location / { return 308 https://auth.pearnly.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.pearnly.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/auth.pearnly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.pearnly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pearnly_tls:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location = / { return 302 /realms/pearnly-business/account/; }
    # Public business login only; no master realm, admin API, health or metrics.
    location ~ ^/(realms/pearnly-business/|resources/) {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host auth.pearnly.com;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host auth.pearnly.com;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Original-Method "";
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
