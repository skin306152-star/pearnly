name: pearnly-production

# 可调容量（2026-09-30）：三产品的识别进程、Cowork 对账进程、网页进程数和各自内存上限
# 从 /opt/pearnly/secrets/runtime.env 读，没写就是下面各处 `:-` 后的原值：
#   PEARNLY_{DMS,ERP,COWORK}_OCR_WORKERS / _OCR_MEM / _OCR_THREADS、PEARNLY_COWORK_LONG_WORKERS / _LONG_MEM、
#   PEARNLY_{DMS,ERP,COWORK}_WEB_WORKERS / _WEB_MEM、PEARNLY_MARIADB_MEM / _MAX_CONNECTIONS。
# 进程数和内存要一起改：capacity.py 按每个进程的最低内存把关，只加进程不加内存会被拒绝启动。

x-runtime: &runtime
  image: ${PEARNLY_IMAGE:?Set the verified image digest}
  restart: unless-stopped
  init: true
  networks: [runtime]
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  environment: &frappe-env
    DB_HOST: mariadb
    REDIS_CACHE: redis://redis-cache:6379
    REDIS_QUEUE: redis://redis-queue:6379
    SOCKETIO_PORT: '9000'
    GUNICORN_WORKERS: '2'
    GUNICORN_THREADS: '4'

x-web: &web
  <<: *runtime
  mem_limit: 768m
  command: [/home/frappe/frappe-bench/env/bin/gunicorn, --chdir=/home/frappe/frappe-bench/sites, --bind=0.0.0.0:8000, --threads=4, --workers=2, --worker-class=gthread, --worker-tmp-dir=/dev/shm, --timeout=120, --graceful-timeout=120, --preload, frappe.app:application]
  depends_on:
    mariadb: {condition: service_healthy}
    redis-cache: {condition: service_healthy}
    redis-queue: {condition: service_healthy}

x-worker: &worker
  <<: *runtime
  mem_limit: 768m
  command: [bench, worker, --queue, 'short,default,long']

x-scheduler: &scheduler
  <<: *runtime
  mem_limit: 192m
  stop_grace_period: 5s
  command: [bench, schedule]

x-socketio: &socketio
  <<: *runtime
  mem_limit: 256m
  command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

# 前端 nginx 用本仓的 `frappe.conf.template`（镜像自带那份的原文 + 静态文件缓存规则），
# 挂在各前端的 volumes 里（列表不随锚点合并）。
x-frontend: &frontend
  <<: *runtime
  mem_limit: 128m
  entrypoint: [nginx-entrypoint.sh]

services:
  mariadb:
    image: mariadb:11.8@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    restart: unless-stopped
    # 可在 runtime.env 调（PEARNLY_MARIADB_MEM）：连接上限 300 后每个连接还要一份缓冲，2026-10-01 压测时已到 1.65 / 2GiB。
    # 线上可先 `docker update --memory` 不重启生效，这里保证重建后仍是同一值。
    mem_limit: ${PEARNLY_MARIADB_MEM:-2g}
    # --max-allowed-packet: 大数据量租户的单份快照可达 20MB 以上（rayong 15,135 个客户），
    # 默认 16MB 会让写入在读取中途被数据库拒绝。必须覆盖 store.MAX_BYTES。
    # --max-connections：runtime.env 的 PEARNLY_MARIADB_MAX_CONNECTIONS，默认 151（MariaDB 默认值）。2026-10-01 线上 SET GLOBAL 到 300
    # 后，真实大文件回归把数据库顶到 2g 上限、被 OOM 杀了一次（每个连接的缓冲可随 64M 的大包涨到几十 MB）；
    # 现按估算高峰约 110 个连接保持 151。要调高先把 PEARNLY_MARIADB_MEM 一起调大。
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --innodb-buffer-pool-size=1G, --max-allowed-packet=64M, '--max-connections=${PEARNLY_MARIADB_MAX_CONNECTIONS:-151}']
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: keycloak
      MARIADB_USER: keycloak
      MARIADB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes: [database:/var/lib/mysql]
    networks: [runtime]
    logging: *logging
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis:6.2-alpine@sha256:ad151300731763a711bf517916519e5cc8f035c95139aa1750836048390439d0
    restart: unless-stopped
    mem_limit: 192m
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    networks: [runtime]
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10

  redis-queue:
    image: redis:6.2-alpine@sha256:ad151300731763a711bf517916519e5cc8f035c95139aa1750836048390439d0
    restart: unless-stopped
    mem_limit: 256m
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 160mb, --maxmemory-policy, noeviction]
    volumes: [queue:/data]
    networks: [runtime]
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    restart: unless-stopped
    mem_limit: 1g
    command: [start, --http-enabled=true, --hostname-strict=true, --health-enabled=true, --proxy-headers=xforwarded]
    environment:
      KC_HOSTNAME: https://${AUTH_HOST:?}
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: pearnly-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_APPEND: -Xms256m -Xmx512m
    ports: ['127.0.0.1:8180:8080', '127.0.0.1:9180:9000']
    volumes: ['../keycloak/themes/pearnly:/opt/keycloak/themes/pearnly:ro']
    networks: [runtime]
    logging: *logging
    depends_on:
      mariadb: {condition: service_healthy}

  billing-web:
    <<: *web
    mem_limit: 512m
    ports: ['127.0.0.1:8184:8000']
    volumes:
      - sites-billing:/home/frappe/frappe-bench/sites
      # 备份/迁移都在这个容器里跑，见 mariadb-client.cnf 的头注。
      - ./mariadb-client.cnf:/etc/mysql/mariadb.conf.d/zz-pearnly-client.cnf:ro

  dms-web:
    profiles: [dms]
    <<: *web
    # 进程数与内存上限可在 runtime.env 调（压测后按实测定），默认即原值；见文件头「可调容量」。
    mem_limit: ${PEARNLY_DMS_WEB_MEM:-1g}
    command: [/home/frappe/frappe-bench/env/bin/gunicorn, --chdir=/home/frappe/frappe-bench/sites, --bind=0.0.0.0:8000, --threads=4, '--workers=${PEARNLY_DMS_WEB_WORKERS:-2}', --worker-class=gthread, --worker-tmp-dir=/dev/shm, --timeout=120, --graceful-timeout=120, --preload, frappe.app:application]
    volumes: &dms-volumes
      - sites-dms:/home/frappe/frappe-bench/sites
      - /opt/pearnly/secrets/ocr.json:/run/secrets/ocr.json:ro
      - ./mariadb-client.cnf:/etc/mysql/mariadb.conf.d/zz-pearnly-client.cnf:ro
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
  dms-worker:
    profiles: [dms]
    <<: *worker
    mem_limit: 1g
    command: [bench, worker-pool, --queue, 'short,default,long', --num-workers, '2']
    volumes: *dms-volumes
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
  dms-ocr-worker:
    profiles: [dms]
    <<: *worker
    # 1g：识别完紧接着按证号查客户，要把整份客户快照读进内存（2026-09-28 实测 ris 15,162 个
    # 客户：每个进程峰值从 75MB 涨到 221MB）。两个进程同时各查一次、再加上解码的照片，
    # 就会贴近 512m；1g 留出一倍余量。
    mem_limit: ${PEARNLY_DMS_OCR_MEM:-1g}
    command: [bench, worker-pool, --queue, 'ocr', --num-workers, '${PEARNLY_DMS_OCR_WORKERS:-2}']
    volumes: *dms-volumes
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
      # 识别任务不 fork（Frappe 官方开关）：每个任务 fork 子进程要重新导入识别模块、重新换谷歌令牌，推迟后反复重派时
      # 这些重复准备吃满 CPU（2026-10-01 生产压测 6 进程 556%；测试机同负载对比 CPU 平均 46% → 3%）。
      FRAPPE_BACKGROUND_WORKERS_NOFORK: "1"
      # 每个识别进程同时跑几份（pearnly_core/execution/pool.py）：一份识别大部分时间在等谷歌回复，进程开几个线程
      # 各跑一份，同时在识别的份数就不再被进程数（内存）卡住。1 = 照旧一份一进程。
      PEARNLY_OCR_THREADS: '${PEARNLY_DMS_OCR_THREADS:-1}'
  dms-sync-worker:
    profiles: [dms]
    <<: *worker
    # One browser-capable background lane, never consumes interactive long/OCR.
    # 2g：整组客户快照要一次性持在内存里再落库（含无头浏览器）。2026-09-25 在 1g 下被
    # OOM 杀过（anon-rss 835MB）；2026-09-28 实测容器自 09-26 启动以来的 memory.peak
    # 为 738MB，期间完整读完并发布了 ris 15,155 个客户。2g ≈ 实测峰值 2.7 倍，
    # 客户数到约 4 万前都够用；原 8g 占了容量预算里最大的一块，却从未用到。
    mem_limit: 2g
    command: [bench, worker, --queue, dms_sync]
    volumes:
      - sites-dms:/home/frappe/frappe-bench/sites
      - ./mariadb-client.cnf:/etc/mysql/mariadb.conf.d/zz-pearnly-client.cnf:ro
  dms-ocr-dispatch:
    profiles: [dms]
    <<: *runtime
    # Frappe/site bootstrap exceeded 128 MiB during the unified release cold start.
    mem_limit: 256m
    command: [/home/frappe/frappe-bench/env/bin/python, -m, pearnly_core.execution.dispatch]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]
  dms-scheduler:
    profiles: [dms]
    <<: *scheduler
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]
  dms-socketio:
    profiles: [dms]
    <<: *socketio
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]
  dms-frontend:
    profiles: [dms]
    <<: *frontend
    environment: {BACKEND: 'dms-web:8000', SOCKETIO: 'dms-socketio:9000', FRAPPE_SITE_NAME_HEADER: '$$host'}
    volumes: [sites-dms:/home/frappe/frappe-bench/sites, ./frappe.conf.template:/templates/nginx/frappe.conf.template:ro]
    ports: ['127.0.0.1:8183:8080']
    depends_on: [dms-web, dms-socketio]

  erp-web:
    profiles: [erp]
    <<: *web
    # ERP 网页进程 2026-09-27 激活期间被内核杀过一次（768m）：上限提到 1g，并让 gunicorn 每个进程处理约 2000 个
    # 请求后换新（带抖动，不同时换），防止内存慢慢涨。只改 ERP；DMS / Cowork 网页照旧用 x-web。
    mem_limit: ${PEARNLY_ERP_WEB_MEM:-1g}
    command: [/home/frappe/frappe-bench/env/bin/gunicorn, --chdir=/home/frappe/frappe-bench/sites, --bind=0.0.0.0:8000, --threads=4, '--workers=${PEARNLY_ERP_WEB_WORKERS:-2}', --worker-class=gthread, --worker-tmp-dir=/dev/shm, --timeout=120, --graceful-timeout=120, --preload, --max-requests=2000, --max-requests-jitter=200, frappe.app:application]
    volumes: &erp-volumes
      - sites-erp:/home/frappe/frappe-bench/sites
      - /opt/pearnly/secrets/ocr.json:/run/secrets/ocr.json:ro
      - ./mariadb-client.cnf:/etc/mysql/mariadb.conf.d/zz-pearnly-client.cnf:ro
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
  erp-worker:
    profiles: [erp]
    <<: *worker
    volumes: *erp-volumes
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
  erp-ocr-worker:
    profiles: [erp]
    <<: *worker
    # 两个识别进程共用这一份上限：512m 时手机大图 / 多页 PDF 同时进来就被内核杀掉（2026-09-28 Cowork 压测约 80 次）。
    mem_limit: ${PEARNLY_ERP_OCR_MEM:-2g}
    command: [bench, worker-pool, --queue, 'ocr', --num-workers, '${PEARNLY_ERP_OCR_WORKERS:-2}']
    volumes: *erp-volumes
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
      FRAPPE_BACKGROUND_WORKERS_NOFORK: "1"  # 同 dms-ocr-worker：识别任务不 fork
      PEARNLY_OCR_THREADS: '${PEARNLY_ERP_OCR_THREADS:-1}'  # 同 dms-ocr-worker
  erp-ocr-dispatch:
    profiles: [erp]
    <<: *runtime
    mem_limit: 256m
    command: [/home/frappe/frappe-bench/env/bin/python, -m, pearnly_core.execution.dispatch]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]
  erp-scheduler:
    profiles: [erp]
    <<: *scheduler
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]
  erp-socketio:
    profiles: [erp]
    <<: *socketio
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]
  erp-frontend:
    profiles: [erp]
    <<: *frontend
    environment: {BACKEND: 'erp-web:8000', SOCKETIO: 'erp-socketio:9000', FRAPPE_SITE_NAME_HEADER: '$$host'}
    volumes: [sites-erp:/home/frappe/frappe-bench/sites, ./frappe.conf.template:/templates/nginx/frappe.conf.template:ro]
    ports: ['127.0.0.1:8182:8080']
    depends_on: [erp-web, erp-socketio]

  cowork-web:
    profiles: [cowork]
    <<: *web
    mem_limit: ${PEARNLY_COWORK_WEB_MEM:-768m}
    command: [/home/frappe/frappe-bench/env/bin/gunicorn, --chdir=/home/frappe/frappe-bench/sites, --bind=0.0.0.0:8000, --threads=4, '--workers=${PEARNLY_COWORK_WEB_WORKERS:-2}', --worker-class=gthread, --worker-tmp-dir=/dev/shm, --timeout=120, --graceful-timeout=120, --preload, frappe.app:application]
    volumes: &cowork-volumes
      - sites-cowork:/home/frappe/frappe-bench/sites
      - /opt/pearnly/secrets/ocr.json:/run/secrets/ocr.json:ro
      - ./mariadb-client.cnf:/etc/mysql/mariadb.conf.d/zz-pearnly-client.cnf:ro
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
  cowork-worker:
    profiles: [cowork]
    <<: *worker
    # long 队列归下面的 cowork-long-worker：对账任务在 long 里等识别，最长 25 分钟；和定时任务共用一个进程时，
    # default 里的 run_scheduled_job 全排在对账后面（2026-09-29 压测，一次堆了 12 个）。
    command: [bench, worker, --queue, 'short,default']
    volumes: *cowork-volumes
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
  cowork-long-worker:
    profiles: [cowork]
    <<: *worker
    # 对账后台任务：两个同时跑（旧线上 RECON_WORKER_CONCURRENCY 默认 2），互不排队，也不挡定时任务。
    # 两个进程共用 1.5g：每个进程与原来单个 worker 的 768m 相同。
    mem_limit: ${PEARNLY_COWORK_LONG_MEM:-1536m}
    command: [bench, worker-pool, --queue, long, --num-workers, '${PEARNLY_COWORK_LONG_WORKERS:-2}']
    volumes: *cowork-volumes
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
  cowork-ocr-worker:
    profiles: [cowork]
    <<: *worker
    # 两个识别进程共用这一份上限：512m 时手机大图 / 多页 PDF 同时进来就被内核杀掉（2026-09-28 Cowork 压测约 80 次）。
    mem_limit: ${PEARNLY_COWORK_OCR_MEM:-2g}
    command: [bench, worker-pool, --queue, 'ocr', --num-workers, '${PEARNLY_COWORK_OCR_WORKERS:-2}']
    volumes: *cowork-volumes
    environment:
      <<: *frappe-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ocr.json
      FRAPPE_BACKGROUND_WORKERS_NOFORK: "1"  # 同 dms-ocr-worker：识别任务不 fork
      PEARNLY_OCR_THREADS: '${PEARNLY_COWORK_OCR_THREADS:-1}'  # 同 dms-ocr-worker
      # 一份多页文件同时读几页（pearnly_core/execution/pages.py）：每页线程各占一个数据库连接，开之前按 max_connections 核算。1 = 一页一页读。
      PEARNLY_OCR_PAGE_THREADS: '${PEARNLY_COWORK_OCR_PAGE_THREADS:-1}'
  cowork-ocr-dispatch:
    profiles: [cowork]
    <<: *runtime
    mem_limit: 256m
    command: [/home/frappe/frappe-bench/env/bin/python, -m, pearnly_core.execution.dispatch]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]
  cowork-scheduler:
    profiles: [cowork]
    <<: *scheduler
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]
  cowork-socketio:
    profiles: [cowork]
    <<: *socketio
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]
  cowork-frontend:
    profiles: [cowork]
    <<: *frontend
    environment: {BACKEND: 'cowork-web:8000', SOCKETIO: 'cowork-socketio:9000', FRAPPE_SITE_NAME_HEADER: '$$host'}
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites, ./frappe.conf.template:/templates/nginx/frappe.conf.template:ro]
    ports: ['127.0.0.1:8181:8080']
    depends_on: [cowork-web, cowork-socketio]

volumes:
  database:
  queue:
  sites-billing:
    # Created by bootstrap before billing-web starts; never removed by compose down.
    external: true
    name: pearnly-production_sites-billing
  sites-dms:
    external: true
    name: pearnly-production_sites-dms
  sites-erp:
    external: true
    name: pearnly-production_sites-erp
  sites-cowork:
    external: true
    name: pearnly-production_sites-cowork

networks:
  runtime:
    driver: bridge
