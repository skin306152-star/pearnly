# Pearnly 统一登录主题（身份服务 Keycloak）
#
# 为什么是"身份服务的主题"而不是一个独立页面：
# 密码必须在身份服务这里收 —— 登录只走授权码 + PKCE，自己收密码就得走
# "密码直传"那条特意避开的路径。所以外观套在身份服务自己的登录页上。
#
# parent=base：base 是"模板最全、样式最少"的那套。样式全部由本主题自带
# （resources/css/pearnly-auth.css，整份搬自旧登录页），不引 PatternFly，
# 免得两套样式打架。其余流程页（忘记密码、设新密码、出错页）继承 base 的
# 模板，自动套进我们的外壳。
parent=base
import=common/keycloak

# 样式不放这里：本主题的 <link> 写在 template.ftl 里（顺序有要求 ——
# 旧页整份在前，我们的增补在后）。这里显式置空，避免继承父主题的样式表。
styles=

# 设计里就这四种语言，顺序按设计走「中 / TH / EN / 日」。
locales=zh-CN,th,en,ja

# 不显示内容的过渡页（退出确认自动提交、退出后自动跳回）用的样式表：只为底色与登录页一致。
# pearnly-ai 主题覆盖成自己的样式表（scripts/build-ai-entry.py 生成）。
pearnlyBlankCss=css/pearnly-auth.css
