# Task-owned integration laboratory: no host ports, no external network or secrets.
# Never use this Compose project as an onboarding target or attach existing volumes.
name: pearnly-release-lab

services:
  db:
    image: mariadb:11.8@sha256:8b5f33ebd85d1775657e974ed10434128bb493c80e826ceaa54074fd1a92a112
    mem_limit: 768m
    cpus: 1
    environment:
      MARIADB_ROOT_PASSWORD: unified-release-lab-only
    command: [--innodb-buffer-pool-size=192M, --max-connections=60]
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:6.2-alpine@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    mem_limit: 160m
    cpus: 0.5
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction]
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    mem_limit: 1g
    cpus: 1
    command: [start-dev, --http-enabled=true, --hostname-strict=false]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: release-lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: unified-release-lab-only
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes: [keycloak:/opt/keycloak/data]
  bench:
    image: sha256:d5c874943dc8394a011d8c2b0c795325256d697567a2706c9ed5e25f27fc93f9
    mem_limit: 1g
    cpus: 1.5
    command: [sleep, infinity]
    environment:
      PEARNLY_RELEASE_LAB: "1"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      keycloak: {condition: service_started}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - ../../apps/pearnly_core/pearnly_core:/home/frappe/frappe-bench/apps/pearnly_core/pearnly_core:ro
      - ../../apps/pearnly_control/pearnly_control:/home/frappe/frappe-bench/apps/pearnly_control/pearnly_control:ro
      - ../../apps/pearnly_erp_portal/pearnly_erp_portal:/home/frappe/frappe-bench/apps/pearnly_erp_portal/pearnly_erp_portal:ro
      - ../../apps/pearnly_dms/pearnly_dms:/home/frappe/frappe-bench/apps/pearnly_dms/pearnly_dms:ro
      - ../../apps/pearnly_cowork/pearnly_cowork:/home/frappe/frappe-bench/apps/pearnly_cowork/pearnly_cowork:ro
      - ../../scripts:/workspace/scripts:ro
      - ../../tests:/workspace/tests:ro

networks:
  default:
    internal: true

volumes:
  db:
  sites:
  keycloak:
