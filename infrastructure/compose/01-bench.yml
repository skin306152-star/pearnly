# P1 样板：Frappe 运行组
#
# 三产品各一组（cowork / erp / dms），另加一组控制面（control）。
# 每组内多个 Site 共享同一套 Bench 进程，但**库与账号各自独立**（由
# MariaDB 侧保证，见 02-base 的隔离测试）。
#
# 进程数固定：web 用官方 start.sh 的 gunicorn，worker/scheduler/socketio
# 各一。内存上限按 docs/p1/01-version-matrix.md 的预算表设置。
#
# 控制面只在开发机运行（ADR-004），所以它的预算不计入目标机 12GB 口径；
# 本地样板仍在同一台机器上跑它，是为了让开发环境与生产形态一致。
name: pearnly-sample

x-frappe-env: &frappe-env
  DB_HOST: mariadb
  DB_PORT: "3306"
  REDIS_CACHE: redis://redis-cache:6379
  REDIS_QUEUE: redis://redis-queue:6379
  SOCKETIO_PORT: "9000"
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"

x-frappe-common: &frappe-common
  image: pearnly/frappe-sample:16.34.1
  environment: *frappe-env
  networks: [sample]
  restart: unless-stopped

# 前端产物走**目录挂载**，不走镜像内置的那份。
#
# 为什么：app 代码是 COPY 进镜像的（见 infrastructure/images/frappe.Dockerfile），
# 所以前端一行改动都要重建镜像才生效 —— 每次约 25 秒，迭代前端时太慢。
# 这里把构建产物目录直接挂进容器，`npm run build` 完刷新页面就见效。
# 镜像里**仍然**会打进同一份产物（构建时 COPY），所以生产不依赖这个挂载；
# 挂载只是本机开发时让文件更新更快，去掉挂载也能跑。
# （写成一条挂载记录，方便直接塞进各 web 的 volumes 列表）
# 注意相对层级：compose 的相对路径是相对**本文件所在目录**（infrastructure/compose/），
# 所以要上两层才到仓库根。写成一层会指到 infrastructure/apps/… 去（实际踩到）。
x-frontend-mount: &frontend-mount "../../apps/pearnly_core/pearnly_core/public/pearnly-app:/home/frappe/frappe-bench/apps/pearnly_core/pearnly_core/public/pearnly-app:ro"

# 官方镜像自带的 start.sh 只起 gunicorn 的"动态"应用，/assets 静态资源是留给
# 前置 nginx 的。样例里没有 nginx 层，所以直接用 application_with_statics()
# 这个入口，让 gunicorn 一并把 /assets 提供出来——否则前端资源全部 404。
#
# 生产拓扑会在前面放 nginx 或由边缘承担静态，届时不必用这个入口。
x-web-command: &web-command
  - /home/frappe/frappe-bench/env/bin/gunicorn
  - --chdir=/home/frappe/frappe-bench/sites
  - --bind=0.0.0.0:8000
  - --threads=4
  - --workers=2
  - --worker-class=gthread
  - --worker-tmp-dir=/dev/shm
  - --timeout=120
  - --preload
  - "frappe.app:application_with_statics()"

services:
  # ── Cowork ──────────────────────────────────────────────
  cowork-bench:
    <<: *frappe-common
    mem_limit: 256m
    command: ["sleep", "infinity"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  cowork-web:
    <<: *frappe-common
    mem_limit: 512m
    command: *web-command
    volumes:
      - sites-cowork:/home/frappe/frappe-bench/sites
      - *frontend-mount
    ports: ["127.0.0.1:8101:8000"]

  cowork-worker:
    <<: *frappe-common
    mem_limit: 512m
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  cowork-scheduler:
    # `bench schedule` 不处理 SIGTERM：不加这一条，Docker 会等满默认的 10 秒宽限期
    # 再 SIGKILL，于是"重启调度器"要 10 秒 —— 迭代时这条最肉疼（实测 10s vs 0s）。
    # 调度器只往 Redis 塞任务，被强杀不会丢业务数据，2 秒足够。
    stop_grace_period: 2s
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  cowork-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  # ── ERP ─────────────────────────────────────────────────
  erp-bench:
    <<: *frappe-common
    mem_limit: 256m
    command: ["sleep", "infinity"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  erp-web:
    <<: *frappe-common
    mem_limit: 512m
    command: *web-command
    volumes:
      - sites-erp:/home/frappe/frappe-bench/sites
      - *frontend-mount
    ports: ["127.0.0.1:8102:8000"]

  erp-worker:
    <<: *frappe-common
    mem_limit: 512m
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  erp-scheduler:
    # `bench schedule` 不处理 SIGTERM：不加这一条，Docker 会等满默认的 10 秒宽限期
    # 再 SIGKILL，于是"重启调度器"要 10 秒 —— 迭代时这条最肉疼（实测 10s vs 0s）。
    # 调度器只往 Redis 塞任务，被强杀不会丢业务数据，2 秒足够。
    stop_grace_period: 2s
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  erp-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  # ── DMS ─────────────────────────────────────────────────
  # ⚠️ DMS 组的内存上限比别的组高，因为**它要跑真浏览器**：
  #    MR.ERP DMS 没有开放 API，推送/查重/建档都靠服务端 Playwright 操作它的网页
  #    （老产品铁律，见 docs/p4/16-legacy-credentials-found.md）。
  #    实测踩到：256m 时 chromium 被 OOM 杀掉，表现是脚本**静默死掉**、输出全丢、
  #    而且账号锁来不及释放（留下 15 分钟的死锁）—— 三个症状看起来毫不相干，其实是同一件事。
  #    `dms-web` 也要给：连接向导的"测试连接"是一个 web 请求，老产品就在 web 进程里跑 Playwright。
  #    以后 Cowork / ERP 的推送同样要浏览器时，照这三行加。
  dms-bench:
    <<: *frappe-common
    mem_limit: 1g
    command: ["sleep", "infinity"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  dms-web:
    <<: *frappe-common
    mem_limit: 1g
    command: *web-command
    volumes:
      - sites-dms:/home/frappe/frappe-bench/sites
      - *frontend-mount
    ports: ["127.0.0.1:8103:8000"]

  dms-worker:
    <<: *frappe-common
    mem_limit: 1g
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  dms-scheduler:
    # `bench schedule` 不处理 SIGTERM：不加这一条，Docker 会等满默认的 10 秒宽限期
    # 再 SIGKILL，于是"重启调度器"要 10 秒 —— 迭代时这条最肉疼（实测 10s vs 0s）。
    # 调度器只往 Redis 塞任务，被强杀不会丢业务数据，2 秒足够。
    stop_grace_period: 2s
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  dms-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  # ── 控制面（仅开发机，不计入目标机预算）─────────────────
  control-bench:
    <<: *frappe-common
    mem_limit: 256m
    command: ["sleep", "infinity"]
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

  control-web:
    <<: *frappe-common
    mem_limit: 384m
    command: *web-command
    volumes:
      - sites-control:/home/frappe/frappe-bench/sites
      - *frontend-mount

  # 前置 nginx：把静态资源与 /socket.io 一起提供。
  #
  # 这一步最初漏了，代价很大：Desk 启动要连 Socket.IO，没有 nginx 转发时
  # /socket.io 的请求打到 gunicorn 上会一直挂住（Network 里显示 Pending），
  # Desk 于是反复重试，表现为"界面壳出来了、主区域空白、一直闪"。
  # 同时它也顺带解决了静态资源要靠 gunicorn 兜的问题。
  #
  # 端口只由这一层对外暴露；web 容器不再直接对外。
  control-frontend:
    <<: *frappe-common
    mem_limit: 128m
    entrypoint: [nginx-entrypoint.sh]
    environment:
      BACKEND: control-web:8000
      SOCKETIO: control-socketio:9000
      FRAPPE_SITE_NAME_HEADER: control.localhost
    volumes:
      - sites-control:/home/frappe/frappe-bench/sites
      # 前端 nginx 模板：上游改成"每次请求重新解析"。
      # 镜像里那份会在启动时把 web 的 IP 缓存住，web 容器一重建就 502（见模板里的注释）。
      - ../../infrastructure/compose/nginx/frappe.conf.template:/templates/nginx/frappe.conf.template:ro
    ports: ["127.0.0.1:8104:8080"]
    depends_on: [control-web, control-socketio]

  control-worker:
    <<: *frappe-common
    mem_limit: 384m
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

  control-scheduler:
    # `bench schedule` 不处理 SIGTERM：不加这一条，Docker 会等满默认的 10 秒宽限期
    # 再 SIGKILL，于是"重启调度器"要 10 秒 —— 迭代时这条最肉疼（实测 10s vs 0s）。
    # 调度器只往 Redis 塞任务，被强杀不会丢业务数据，2 秒足够。
    stop_grace_period: 2s
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

  # 控制面也必须有实时服务：Desk 启动时会连 socket.io，连不上会一直重试，
  # 表现是"界面壳出来了、内容空白、一直闪"。这一条最初漏了，踩过。
  control-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

volumes:
  sites-cowork:
  sites-erp:
  sites-dms:
  sites-control:

networks:
  sample:
    driver: bridge
