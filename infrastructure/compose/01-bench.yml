# P1 样板：Frappe 运行组
#
# 三产品各一组（cowork / erp / dms），另加一组控制面（control）。
# 每组内多个 Site 共享同一套 Bench 进程，但**库与账号各自独立**（由
# MariaDB 侧保证，见 02-base 的隔离测试）。
#
# 进程数固定：web 用官方 start.sh 的 gunicorn，worker/scheduler/socketio
# 各一。内存上限按 docs/p1/01-version-matrix.md 的预算表设置。
#
# 控制面只在开发机运行（ADR-004），所以它的预算不计入目标机 12GB 口径；
# 本地样板仍在同一台机器上跑它，是为了让开发环境与生产形态一致。
name: pearnly-sample

x-frappe-env: &frappe-env
  DB_HOST: mariadb
  DB_PORT: "3306"
  REDIS_CACHE: redis://redis-cache:6379
  REDIS_QUEUE: redis://redis-queue:6379
  SOCKETIO_PORT: "9000"
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"

x-frappe-common: &frappe-common
  image: pearnly/frappe-sample:16.34.1
  environment: *frappe-env
  networks: [sample]
  restart: unless-stopped

# 官方镜像自带的 start.sh 只起 gunicorn 的"动态"应用，/assets 静态资源是留给
# 前置 nginx 的。样例里没有 nginx 层，所以直接用 application_with_statics()
# 这个入口，让 gunicorn 一并把 /assets 提供出来——否则前端资源全部 404。
#
# 生产拓扑会在前面放 nginx 或由边缘承担静态，届时不必用这个入口。
x-web-command: &web-command
  - /home/frappe/frappe-bench/env/bin/gunicorn
  - --chdir=/home/frappe/frappe-bench/sites
  - --bind=0.0.0.0:8000
  - --threads=4
  - --workers=2
  - --worker-class=gthread
  - --worker-tmp-dir=/dev/shm
  - --timeout=120
  - --preload
  - "frappe.app:application_with_statics()"

services:
  # ── Cowork ──────────────────────────────────────────────
  cowork-bench:
    <<: *frappe-common
    mem_limit: 256m
    command: ["sleep", "infinity"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  cowork-web:
    <<: *frappe-common
    mem_limit: 512m
    command: *web-command
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]
    ports: ["127.0.0.1:8101:8000"]

  cowork-worker:
    <<: *frappe-common
    mem_limit: 512m
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  cowork-scheduler:
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  cowork-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-cowork:/home/frappe/frappe-bench/sites]

  # ── ERP ─────────────────────────────────────────────────
  erp-bench:
    <<: *frappe-common
    mem_limit: 256m
    command: ["sleep", "infinity"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  erp-web:
    <<: *frappe-common
    mem_limit: 512m
    command: *web-command
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]
    ports: ["127.0.0.1:8102:8000"]

  erp-worker:
    <<: *frappe-common
    mem_limit: 512m
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  erp-scheduler:
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  erp-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-erp:/home/frappe/frappe-bench/sites]

  # ── DMS ─────────────────────────────────────────────────
  dms-bench:
    <<: *frappe-common
    mem_limit: 256m
    command: ["sleep", "infinity"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  dms-web:
    <<: *frappe-common
    mem_limit: 512m
    command: *web-command
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]
    ports: ["127.0.0.1:8103:8000"]

  dms-worker:
    <<: *frappe-common
    mem_limit: 512m
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  dms-scheduler:
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  dms-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-dms:/home/frappe/frappe-bench/sites]

  # ── 控制面（仅开发机，不计入目标机预算）─────────────────
  control-bench:
    <<: *frappe-common
    mem_limit: 256m
    command: ["sleep", "infinity"]
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

  control-web:
    <<: *frappe-common
    mem_limit: 384m
    command: *web-command
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

  # 前置 nginx：把静态资源与 /socket.io 一起提供。
  #
  # 这一步最初漏了，代价很大：Desk 启动要连 Socket.IO，没有 nginx 转发时
  # /socket.io 的请求打到 gunicorn 上会一直挂住（Network 里显示 Pending），
  # Desk 于是反复重试，表现为"界面壳出来了、主区域空白、一直闪"。
  # 同时它也顺带解决了静态资源要靠 gunicorn 兜的问题。
  #
  # 端口只由这一层对外暴露；web 容器不再直接对外。
  control-frontend:
    <<: *frappe-common
    mem_limit: 128m
    entrypoint: [nginx-entrypoint.sh]
    environment:
      BACKEND: control-web:8000
      SOCKETIO: control-socketio:9000
      FRAPPE_SITE_NAME_HEADER: control.localhost
    volumes: [sites-control:/home/frappe/frappe-bench/sites]
    ports: ["127.0.0.1:8104:8080"]
    depends_on: [control-web, control-socketio]

  control-scheduler:
    <<: *frappe-common
    mem_limit: 192m
    command: ["bench", "schedule"]
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

  # 控制面也必须有实时服务：Desk 启动时会连 socket.io，连不上会一直重试，
  # 表现是"界面壳出来了、内容空白、一直闪"。这一条最初漏了，踩过。
  control-socketio:
    <<: *frappe-common
    mem_limit: 256m
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: [sites-control:/home/frappe/frappe-bench/sites]

volumes:
  sites-cowork:
  sites-erp:
  sites-dms:
  sites-control:

networks:
  sample:
    driver: bridge
