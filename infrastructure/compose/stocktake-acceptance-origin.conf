# Native Frappe realtime authenticates through the public origin. The isolated
# local origin has no public DNS/edge; resolve it inside this project's network.
# Port 80 is internal only. The unmodified upstream server still serves on 8080.
server {
    listen 80;
    server_name stocktake.localhost;
    location / {
        proxy_set_header Host stocktake.localhost;
        proxy_pass http://127.0.0.1:8080;
    }
}
