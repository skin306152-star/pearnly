# Local backend verification only. Internal network has no external route.
name: pearnly-cowork-backend-lab
services:
  db:
    image: mariadb:11.8@sha256:8b5f33ebd85d1775657e974ed10434128bb493c80e826ceaa54074fd1a92a112
    mem_limit: 512m
    cpus: 1
    environment:
      MARIADB_ROOT_PASSWORD: cowork-backend-lab-only
    command: [--innodb-buffer-pool-size=128M, --max-connections=40]
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:6.2-alpine@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    mem_limit: 128m
    cpus: 0.5
    command: [redis-server, --maxmemory, 96mb, --maxmemory-policy, noeviction]
  bench:
    image: sha256:90c1d545d215d6081965740013dd8af84337ca23c5fde5c36acdf162cd4655c3
    mem_limit: 768m
    cpus: 1
    command: [sleep, infinity]
    environment:
      PEARNLY_COWORK_BACKEND_LAB: "1"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - ../../apps/pearnly_core/pearnly_core:/home/frappe/frappe-bench/apps/pearnly_core/pearnly_core:ro
      - ../../apps/pearnly_cowork/pearnly_cowork:/home/frappe/frappe-bench/apps/pearnly_cowork/pearnly_cowork:ro
      - ../../scripts:/workspace/scripts:ro
      - ../../tests:/workspace/tests:ro
networks:
  default:
    internal: true
volumes:
  db:
  sites:
