# Isolated development fixture; never register as a formal provisioning target.
name: pearnly-auth-preview
services:
  db:
    image: mariadb:11.8@sha256:8b5f33ebd85d1775657e974ed10434128bb493c80e826ceaa54074fd1a92a112
    environment:
      MARIADB_ROOT_PASSWORD: preview-local-only
    volumes: ["db:/var/lib/mysql"]
  redis:
    image: redis:6.2-alpine@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: ["start", "--http-enabled=true", "--http-port=8185", "--hostname=http://auth-preview-keycloak.localhost:8185", "--import-realm", "--spi-theme--cache-themes=false", "--spi-theme--cache-templates=false"]
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://db:3306/keycloak_preview
      KC_DB_USERNAME: keycloak_preview
      KC_DB_PASSWORD: preview-db-local-only
      JAVA_OPTS_APPEND: -Xms256m -Xmx512m
      KC_BOOTSTRAP_ADMIN_USERNAME: preview-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: preview-local-only
    ports: ["127.0.0.1:8185:8185"]
    volumes:
      - ../keycloak/themes/pearnly:/opt/keycloak/themes/pearnly:ro
      - ../keycloak/preview:/opt/keycloak/data/import:ro
    networks:
      default:
        aliases: [auth-preview-keycloak.localhost]
  site:
    image: pearnly/frappe-sample:16.34.1
    command: ["bench", "serve", "--port", "8000", "--noreload"]
    volumes: &preview_volumes
      - sites:/home/frappe/frappe-bench/sites
      - ../../apps/pearnly_core/pearnly_core:/home/frappe/frappe-bench/apps/pearnly_core/pearnly_core:ro
      - ../../apps/pearnly_control/pearnly_control:/home/frappe/frappe-bench/apps/pearnly_control/pearnly_control:ro
      - ../../apps/pearnly_dms/pearnly_dms:/home/frappe/frappe-bench/apps/pearnly_dms/pearnly_dms:ro
      - ../../apps/pearnly_cowork/pearnly_cowork:/home/frappe/frappe-bench/apps/pearnly_cowork/pearnly_cowork:ro
      - ../../apps/pearnly_erp_portal/pearnly_erp_portal:/home/frappe/frappe-bench/apps/pearnly_erp_portal/pearnly_erp_portal:ro
  proxy:
    image: pearnly/frappe-sample:16.34.1
    command: ["nginx", "-c", "/tmp/preview-nginx.conf", "-g", "daemon off;"]
    ports: ["127.0.0.1:8184:8184"]
    volumes:
      - ./auth-preview-nginx.conf:/tmp/preview-nginx.conf:ro
    networks:
      default:
        aliases: [auth-preview.localhost, control-preview.localhost, desk-preview.localhost]
  socketio:
    image: pearnly/frappe-sample:16.34.1
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    ports: ["127.0.0.1:8186:8186"]
    volumes: *preview_volumes
  worker:
    image: pearnly/frappe-sample:16.34.1
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes: *preview_volumes
volumes:
  db:
  sites:
