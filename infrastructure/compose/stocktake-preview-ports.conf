# 预览 frontend 的容器内监听：socketio 的鉴权回调是**按浏览器 origin 拼 URL** 回源的，
# 所以在内网里也必须能按名字解析到本容器。名字只有一个所有者（见 stocktake-preview.yml），
# 于是这里按端口把两条 lane 分流回各自的 web：
#   8126 → 验收 lane（正式镜像里的 erp-web）
#   8136 → 预览 lane（挂载源码的 erp-web-preview）
server {
    listen 8126;
    server_name stocktake.localhost;
    location / {
        proxy_set_header Host stocktake.localhost;
        proxy_set_header X-Frappe-Site-Name stocktake.localhost;
        proxy_pass http://erp-web:8000;
    }
}

server {
    listen 8136;
    server_name stocktake.localhost;
    location / {
        proxy_set_header Host stocktake.localhost;
        proxy_set_header X-Frappe-Site-Name stocktake.localhost;
        proxy_pass http://erp-web-preview:8000;
    }
}
